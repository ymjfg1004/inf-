<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Buggle World — Bug Hunt</title>
<style>
  :root{
    --blue-l:#8ea6f2; --blue:#4a63d8; --blue-d:#2a3566; --navy:#1c2547;
    --pink:#f77fa0; --yellow:#f7c948; --paper:#eef0f6; --ink:#20305e;
    --glitch:#6b3fa0; --bug:#1b1c22;
  }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:#0d1330; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo",sans-serif; }
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas{ display:block; touch-action:none; }
  .overlay{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px; text-align:center; padding:26px;
    background:radial-gradient(120% 90% at 50% 0%, rgba(74,99,216,.30), rgba(13,19,48,.92));
    backdrop-filter:blur(7px); color:#fff; z-index:10;
  }
  .brand{ font-size:44px; font-weight:900; letter-spacing:-1px; color:#fff; }
  .brand .u{ position:relative; }
  .brand .dots{ color:var(--blue-l); }
  .sub{ font-size:14px; opacity:.82; line-height:1.6; max-width:330px; }
  .sub b{ color:var(--blue-l); }
  .sub .bad{ color:#c79bff; }
  .big{ font-size:46px; font-weight:900; }
  .win .big{ color:#7dffa8; } .lose .big{ color:#ff8f8f; }
  .btn{
    margin-top:8px; padding:16px 46px; border:none; border-radius:18px; cursor:pointer;
    font-size:19px; font-weight:900; color:#fff;
    background:linear-gradient(135deg,var(--blue-l),var(--blue));
    box-shadow:0 10px 26px rgba(74,99,216,.5); transition:transform .08s;
  }
  .btn:active{ transform:scale(.95); }
  .hint{ font-size:12px; opacity:.55; margin-top:4px; }
  .hidden{ display:none !important; }
  .avatar{ width:130px; height:130px; }
</style>

<div id="wrap"><canvas id="cv"></canvas></div>

<div id="startScreen" class="overlay">
  <canvas id="heroCv" class="avatar" width="260" height="260"></canvas>
  <div class="brand"><span class="u">B<span class="dots">ü</span>ggle</span> World</div>
  <div class="sub">
    버그를 방치하면 <span class="bad">글리치 → 킹 글리치</span>로 진화해요.<br>
    <b>버비(Bugby)</b> 부대를 이끌고 게이트를 지나 병력을 불려서<br>
    최강 보스 <span class="bad">킹 글리치</span>를 잡으세요!
  </div>
  <div class="sub" style="opacity:.7;font-size:13px">
    👉 화면을 <b>좌우로 드래그</b>해 조종 · <b>파란 +/×</b> 통과, <span class="bad">보라 −/÷</span> 회피
  </div>
  <button class="btn" id="startBtn">출동! ▶</button>
  <div class="hint">버비 vs 버그링 · 글리치 · 킹 글리치</div>
</div>

<div id="endScreen" class="overlay hidden">
  <div class="brand" id="endTitle" style="font-size:32px"></div>
  <div class="big" id="endBig"></div>
  <div class="sub" id="endMsg"></div>
  <button class="btn" id="againBtn"></button>
</div>

<script>
const cv = document.getElementById('cv');
let ctx = cv.getContext('2d');
const mainCtx = ctx;

// ===== 팔레트 =====
const C = {
  blueL:'#8ea6f2', blue:'#4a63d8', blueD:'#2a3566', navy:'#1c2547',
  pink:'#f77fa0', yellow:'#f7c948', paper:'#eef0f6', white:'#f4f5fb',
  face:'#f6f7fc', cheek:'#f6a6b4', ink:'#20305e',
  glitch:'#7a4bc0', glitchD:'#3a1f66', bug:'#1b1c22', bugEye:'#f8f8fb',
  red:'#ff3b5c',
};

// ===== 화면 =====
let W,H,DPR;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  const maxW=480, availW=Math.min(window.innerWidth,maxW), availH=window.innerHeight;
  let w=availW, h=w*16/9; if(h>availH){ h=availH; w=h*9/16; }
  cv.style.width=w+'px'; cv.style.height=h+'px';
  cv.width=w*DPR; cv.height=h*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  W=w; H=h;
}
window.addEventListener('resize',resize); resize();

// ===== 상태 =====
const State={START:0,PLAY:1,BATTLE:2,END:3};
let state=State.START, level=1, best=+(localStorage.getItem('buggle_best')||0);

const game={ count:0, displayCount:0, laneX:.5, targetLaneX:.5, scroll:0, speed:0,
  gates:[], boss:null, flash:0, troops:[], particles:[], swarm:[] };

// ===== 게이트 =====
function makeGateRow(z){ return { z, passed:false, options:pickPair() }; }
function pickPair(){
  function op(good){
    const r=Math.random();
    if(good){
      if(r<.45) return {type:'add', val:5+Math.floor(Math.random()*(8+level*2))};
      return {type:'mul', val:2+Math.floor(Math.random()*2)};
    } else {
      if(r<.55) return {type:'sub', val:5+Math.floor(Math.random()*(10+level*3))};
      return {type:'div', val:2};
    }
  }
  const bothGood=Math.random()<.22; let l,rr;
  if(bothGood){ l=op(true); rr=op(true); }
  else if(Math.random()<.5){ l=op(true); rr=op(false); }
  else { l=op(false); rr=op(true); }
  return [l,rr];
}
const goodGate=o=>o.type==='add'||o.type==='mul';
const gateColor=o=>goodGate(o)?C.blue:C.glitch;
const gateLabel=o=>({add:'+',mul:'×',sub:'−',div:'÷'}[o.type])+o.val;
function applyGate(o){
  let c=game.count;
  if(o.type==='add')c+=o.val; else if(o.type==='mul')c*=o.val;
  else if(o.type==='sub')c-=o.val; else c=Math.floor(c/o.val);
  game.count=Math.max(0,Math.round(c));
}

// 보스 진화 단계: 레벨에 따라 버그링→글리치→킹 글리치
function bossTier(){ return level<=1?0 : level<=3?1 : 2; } // 0 bugling,1 glitch,2 king
const bossName=['버그링 무리','글리치','킹 글리치'];

// ===== 레벨 시작 =====
function startLevel(){
  state=State.PLAY;
  game.count=20; game.displayCount=20; game.laneX=.5; game.targetLaneX=.5;
  game.scroll=0; game.speed=155; game.flash=0; game.particles=[]; game.gates=[];
  const rows=7+level;
  for(let i=0;i<rows;i++) game.gates.push(makeGateRow(400+i*260));
  const lastZ=400+rows*260+440;
  const hp=Math.round((110+level*95)*(1+level*.14));
  game.boss={ z:lastZ, hp, maxHp:hp, defeated:false, dead:0, tier:bossTier() };
  game.troops=[]; for(let i=0;i<200;i++) game.troops.push({ox:Math.random()*2-1,oy:Math.random()*2-1});
  // 길가에 떠도는 버그링 스웜(연출)
  game.swarm=[]; for(let i=0;i<10;i++) game.swarm.push({z:600+Math.random()*2200, side:Math.random()<.5?-1:1, ph:Math.random()*6});
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.add('hidden');
}

// ===== 입력 =====
let dragging=false,dragStartX=0,laneStart=0;
const pDown=x=>{dragging=true;dragStartX=x;laneStart=game.targetLaneX;};
const pMove=x=>{ if(!dragging)return; const dx=(x-dragStartX)/(cv.clientWidth*.6);
  game.targetLaneX=Math.max(.12,Math.min(.88,laneStart+dx)); };
const pUp=()=>dragging=false;
cv.addEventListener('mousedown',e=>pDown(e.clientX));
window.addEventListener('mousemove',e=>pMove(e.clientX));
window.addEventListener('mouseup',pUp);
cv.addEventListener('touchstart',e=>{e.preventDefault();pDown(e.touches[0].clientX);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();pMove(e.touches[0].clientX);},{passive:false});
cv.addEventListener('touchend',pUp);

// ===== 원근 투영 =====
const ROAD_TOP=.10, ROAD_BOT=.82;
function project(z,laneX){
  const rel=z-game.scroll, maxView=900;
  const p=1-Math.min(Math.max(rel,0),maxView)/maxView;
  const persp=Math.pow(p,1.35);
  const y=H*(ROAD_TOP+(ROAD_BOT-ROAD_TOP)*persp);
  const roadHalf=(0.06+0.40*persp)*W;
  const cx=W*.5+(laneX-.5)*roadHalf*2;
  const scale=0.18+0.9*persp;
  return {x:cx,y,scale,roadHalf,persp,rel};
}

// ===== 캐릭터 드로잉 =====
function roundRect(x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// 버비: r = 얼굴 반지름. detail=true면 볼/눈/B
function drawBugby(x,y,r,detail){
  // 안테나
  ctx.strokeStyle=C.blue; ctx.lineWidth=Math.max(1,r*.18); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-r*.4,y-r*.7); ctx.lineTo(x-r*.7,y-r*1.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+r*.4,y-r*.7); ctx.lineTo(x+r*.7,y-r*1.5); ctx.stroke();
  ctx.fillStyle=C.blue;
  ctx.beginPath(); ctx.arc(x-r*.7,y-r*1.5,r*.26,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*.7,y-r*1.5,r*.26,0,7); ctx.fill();
  // 후드(파란 배경 원)
  ctx.fillStyle=C.blue;
  ctx.beginPath(); ctx.arc(x,y-r*.05,r*1.12,0,7); ctx.fill();
  // 몸통(후드티)
  ctx.fillStyle=C.blue;
  roundRect(x-r*.9,y+r*.5,r*1.8,r*1.5,r*.5); ctx.fill();
  // 얼굴(흰색)
  ctx.fillStyle=C.face;
  ctx.beginPath(); ctx.arc(x,y-r*.05,r*.86,0,7); ctx.fill();
  // 눈
  ctx.fillStyle='#101426';
  const ey=y-r*.05, ex=r*.34, es=Math.max(1,r*.19);
  ctx.beginPath(); ctx.arc(x-ex,ey,es,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+ex,ey,es,0,7); ctx.fill();
  if(detail){
    // 눈 하이라이트
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(x-ex+es*.3,ey-es*.3,es*.35,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+ex+es*.3,ey-es*.3,es*.35,0,7); ctx.fill();
    // 볼
    ctx.fillStyle=C.cheek; ctx.globalAlpha=.8;
    ctx.beginPath(); ctx.arc(x-r*.55,ey+r*.28,r*.16,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+r*.55,ey+r*.28,r*.16,0,7); ctx.fill();
    ctx.globalAlpha=1;
    // 입
    ctx.strokeStyle='#101426'; ctx.lineWidth=r*.1;
    ctx.beginPath(); ctx.arc(x,ey+r*.3,r*.18,.15*Math.PI,.85*Math.PI); ctx.stroke();
    // B 로고
    ctx.fillStyle='#fff'; ctx.font=`900 ${r*.8}px -apple-system,sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('B',x,y+r*1.25);
  }
}

// 버그: type 0 버그링(검), 1 글리치(보라), 2 킹(보라+왕관). r=몸 반지름
function drawBug(x,y,r,type){
  const body = type===0?C.bug : (type===1?'#2a1a44':'#2c153f');
  // 다리
  ctx.strokeStyle=body; ctx.lineWidth=Math.max(1,r*.16); ctx.lineCap='round';
  for(const s of [-1,1]) for(const dy of [-.2,.15,.5]){
    ctx.beginPath(); ctx.moveTo(x+s*r*.7,y+r*dy); ctx.lineTo(x+s*r*1.15,y+r*(dy+.15)); ctx.stroke();
  }
  // 아우라(글리치)
  if(type>0){ ctx.fillStyle=type===2?'rgba(150,60,220,.28)':'rgba(120,60,190,.22)';
    ctx.beginPath(); ctx.arc(x,y,r*1.5,0,7); ctx.fill(); }
  // 몸통
  ctx.fillStyle=body; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  // 스파이크(글리치/킹)
  if(type>0){ ctx.fillStyle=type===2?'#4a1f7a':'#3a1a5e';
    const spikes=type===2?10:8;
    for(let i=0;i<spikes;i++){ const a=i/spikes*Math.PI*2;
      ctx.beginPath();
      ctx.moveTo(x+Math.cos(a-.12)*r,y+Math.sin(a-.12)*r);
      ctx.lineTo(x+Math.cos(a)*r*1.5,y+Math.sin(a)*r*1.5);
      ctx.lineTo(x+Math.cos(a+.12)*r,y+Math.sin(a+.12)*r); ctx.fill();
    }
    ctx.fillStyle=body; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  }
  // 더듬이
  ctx.strokeStyle=body; ctx.lineWidth=Math.max(1,r*.13);
  ctx.beginPath(); ctx.moveTo(x-r*.3,y-r*.85); ctx.lineTo(x-r*.5,y-r*1.4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+r*.3,y-r*.85); ctx.lineTo(x+r*.5,y-r*1.4); ctx.stroke();
  ctx.fillStyle=body;
  ctx.beginPath(); ctx.arc(x-r*.5,y-r*1.4,r*.14,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*.5,y-r*1.4,r*.14,0,7); ctx.fill();
  // 눈
  const evil=type>0, ew=r*.34, eh=r*(evil?.28:.42), ex=r*.36, ey=y-r*.05;
  ctx.fillStyle=evil?'#ff2a3a':C.bugEye;
  ctx.beginPath(); ctx.ellipse(x-ex,ey,ew,eh,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+ex,ey,ew,eh,0,0,7); ctx.fill();
  if(evil){ // 성난 눈썹
    ctx.strokeStyle='#000'; ctx.lineWidth=r*.14;
    ctx.beginPath(); ctx.moveTo(x-ex-ew,ey-eh*1.1); ctx.lineTo(x-ex+ew*.6,ey-eh*.2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+ex+ew,ey-eh*1.1); ctx.lineTo(x+ex-ew*.6,ey-eh*.2); ctx.stroke();
  } else {
    ctx.fillStyle='#101018';
    ctx.beginPath(); ctx.arc(x-ex,ey+eh*.1,ew*.5,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+ex,ey+eh*.1,ew*.5,0,7); ctx.fill();
  }
  // 왕관(킹)
  if(type===2){
    ctx.fillStyle=C.yellow;
    const cw=r*1.3, cx=x-cw/2, cy=y-r*1.7, ch=r*.6;
    ctx.beginPath(); ctx.moveTo(cx,cy+ch);
    ctx.lineTo(cx,cy); ctx.lineTo(cx+cw*.25,cy+ch*.5); ctx.lineTo(cx+cw*.5,cy-ch*.2);
    ctx.lineTo(cx+cw*.75,cy+ch*.5); ctx.lineTo(cx+cw,cy); ctx.lineTo(cx+cw,cy+ch); ctx.closePath(); ctx.fill();
  }
}

// ===== 배경 =====
function drawBackground(){
  const g=ctx.createLinearGradient(0,0,0,H*ROAD_BOT);
  g.addColorStop(0,'#20306a'); g.addColorStop(1,'#5a76c8');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#0d1330'; ctx.fillRect(0,H*ROAD_TOP,W,H);
  const top=project(game.scroll+900,.5), bot=project(game.scroll,.5);
  ctx.beginPath();
  ctx.moveTo(W*.5-top.roadHalf,top.y); ctx.lineTo(W*.5+top.roadHalf,top.y);
  ctx.lineTo(W*.5+bot.roadHalf,bot.y); ctx.lineTo(W*.5-bot.roadHalf,bot.y); ctx.closePath();
  const rg=ctx.createLinearGradient(0,top.y,0,bot.y);
  rg.addColorStop(0,'#6f83b8'); rg.addColorStop(1,'#cdd6ec');
  ctx.fillStyle=rg; ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.6)';
  for(let z=game.scroll%130;z<900;z+=130){
    const a=project(game.scroll+z,.5), b=project(game.scroll+z+55,.5);
    ctx.lineWidth=Math.max(1,a.scale*4);
    ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
  }
}

function drawSwarm(){
  for(const s of game.swarm){
    const rel=s.z-game.scroll; if(rel<-60||rel>900) continue;
    const lane=.5+s.side*.42;
    const p=project(s.z,lane);
    const bob=Math.sin(performance.now()*.004+s.ph)*6*p.scale;
    drawBug(p.x, p.y-30*p.scale+bob, 9*p.scale, 0);
  }
}

function drawGates(){
  for(let i=game.gates.length-1;i>=0;i--){
    const row=game.gates[i]; if(row.passed) continue;
    const rel=row.z-game.scroll; if(rel<-40||rel>900) continue;
    drawGateRow(row);
  }
}
function drawGateRow(row){
  const p=project(row.z,.5), h=90*p.scale;
  const laneXs=[.5-.24,.5+.24];
  for(let s=0;s<2;s++){
    const o=row.options[s], proj=project(row.z,laneXs[s]), w=p.roadHalf*.86, x=proj.x, y=proj.y;
    ctx.globalAlpha=.92; ctx.fillStyle=gateColor(o);
    roundRect(x-w/2,y-h,w,h,6*p.scale); ctx.fill();
    ctx.globalAlpha=1; ctx.fillStyle='rgba(255,255,255,.28)';
    roundRect(x-w/2,y-h,w,8*p.scale,4*p.scale); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font=`900 ${Math.max(11,34*p.scale)}px -apple-system,sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(gateLabel(o),x,y-h*.5);
  }
  ctx.globalAlpha=1;
}

function drawCrowd(){
  const base=project(game.scroll,game.laneX);
  const n=Math.min(game.count,120), spread=base.roadHalf*.82;
  // 뒤→앞 정렬로 겹침 자연스럽게
  for(let i=n-1;i>=0;i--){
    const t=game.troops[i%game.troops.length];
    const px=base.x+t.ox*spread*.5;
    const py=base.y-4-Math.abs(t.oy)*30-(i%5)*4;
    drawBugby(px,py,8.5*base.scale,false);
  }
  ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(20,25,50,.6)'; ctx.lineWidth=5;
  ctx.font='900 42px -apple-system,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
  const label=Math.round(game.displayCount).toString();
  ctx.strokeText(label,base.x,base.y+50); ctx.fillText(label,base.x,base.y+50);
}

function drawBoss(){
  const b=game.boss; if(!b) return;
  if(b.z-game.scroll>1000) return;
  const p=project(b.z,.5), R=52*p.scale*2.4, x=p.x, y=p.y-R;
  ctx.fillStyle='rgba(0,0,0,.3)';
  ctx.beginPath(); ctx.ellipse(x,p.y+4,R*.7,R*.2,0,0,7); ctx.fill();
  ctx.globalAlpha=Math.max(.15,1-b.dead);
  drawBug(x,y,R,b.tier);
  ctx.globalAlpha=1;
  if(!b.defeated){
    ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=5;
    ctx.font=`900 ${Math.max(18,54*p.scale)}px -apple-system,sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const t=Math.max(0,Math.round(b.hp)).toString();
    ctx.strokeText(t,x,y+R*1.55); ctx.fillText(t,x,y+R*1.55);
    const bw=R*1.4;
    ctx.fillStyle='rgba(0,0,0,.5)'; roundRect(x-bw/2,y-R*1.35,bw,8*p.scale,4); ctx.fill();
    ctx.fillStyle=C.pink; roundRect(x-bw/2,y-R*1.35,bw*(b.hp/b.maxHp),8*p.scale,4); ctx.fill();
    // 보스 이름표
    ctx.fillStyle='#fff'; ctx.globalAlpha=.85;
    ctx.font=`800 ${Math.max(11,20*p.scale)}px -apple-system,sans-serif`;
    ctx.fillText(bossName[b.tier],x,y-R*1.6); ctx.globalAlpha=1;
  }
}

function drawParticles(){
  for(const pt of game.particles){ ctx.globalAlpha=Math.max(0,pt.life);
    ctx.fillStyle=pt.color; ctx.beginPath(); ctx.arc(pt.x,pt.y,pt.r,0,7); ctx.fill(); }
  ctx.globalAlpha=1;
}

function drawHUD(){
  ctx.fillStyle='rgba(15,20,45,.5)'; roundRect(10,10,116,34,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='800 15px -apple-system,sans-serif';
  ctx.textAlign='left'; ctx.textBaseline='middle'; ctx.fillText('스테이지 '+level,22,27);
  ctx.fillStyle='rgba(15,20,45,.5)'; roundRect(W-126,10,116,34,10); ctx.fill();
  ctx.fillStyle=C.yellow; ctx.textAlign='right'; ctx.fillText('최고 '+best,W-22,27);
}

// ===== 루프 =====
let lastT=performance.now();
function loop(now){
  const dt=Math.min((now-lastT)/1000,.05); lastT=now;
  if(state===State.PLAY||state===State.BATTLE) update(dt);
  render(); requestAnimationFrame(loop);
}
function update(dt){
  game.laneX+=(game.targetLaneX-game.laneX)*Math.min(1,dt*12);
  game.displayCount+=(game.count-game.displayCount)*Math.min(1,dt*10);
  if(state===State.PLAY){
    game.scroll+=game.speed*dt;
    for(const row of game.gates){
      if(row.passed) continue;
      if(game.scroll>=row.z){
        row.passed=true;
        const o=row.options[game.laneX<.5?0:1];
        applyGate(o); game.flash=goodGate(o)?.25:-.25; burst(o);
        if(game.count<=0) return endGame(false);
      }
    }
    if(game.scroll>=game.boss.z-40){ state=State.BATTLE; game.speed=0; }
  } else if(state===State.BATTLE){
    const b=game.boss, dps=Math.max(30,game.count*2.2);
    b.hp-=dps*dt;
    game.count-=(b.maxHp/(b.maxHp+game.count+1))*dps*dt*.12; game.count=Math.max(0,game.count);
    b.dead=1-Math.max(0,b.hp)/b.maxHp; battleFx();
    if(b.hp<=0){ b.defeated=true; return endGame(true); }
    if(game.count<=.5) return endGame(false);
  }
  game.flash*=Math.pow(.001,dt);
  for(const pt of game.particles){ pt.x+=pt.vx*dt; pt.y+=pt.vy*dt; pt.vy+=400*dt; pt.life-=dt*1.4; }
  game.particles=game.particles.filter(p=>p.life>0);
}
function burst(o){
  const base=project(game.scroll,game.laneX), good=goodGate(o);
  for(let i=0;i<16;i++) game.particles.push({x:base.x,y:base.y-10,
    vx:(Math.random()*2-1)*140,vy:-Math.random()*220-40,r:3+Math.random()*3,
    life:.6+Math.random()*.4,color:good?'#7dffa8':'#c79bff'});
}
function battleFx(){
  const b=game.boss,p=project(b.z,.5);
  for(let i=0;i<3;i++) game.particles.push({x:p.x+(Math.random()*2-1)*40,y:p.y-70-Math.random()*60,
    vx:(Math.random()*2-1)*80,vy:-Math.random()*120,r:2+Math.random()*3,
    life:.4+Math.random()*.3,color:Math.random()<.5?C.yellow:'#c79bff'});
}
function render(){
  ctx.clearRect(0,0,W,H);
  drawBackground(); drawSwarm(); drawGates(); drawBoss(); drawCrowd(); drawParticles(); drawHUD();
  if(Math.abs(game.flash)>.01){
    ctx.fillStyle=game.flash>0?`rgba(125,255,168,${game.flash})`:`rgba(199,155,255,${-game.flash})`;
    ctx.fillRect(0,0,W,H);
  }
}

// ===== 종료 =====
function endGame(win){
  state=State.END;
  const es=document.getElementById('endScreen');
  es.classList.remove('hidden','win','lose');
  const T=document.getElementById('endTitle'), B=document.getElementById('endBig'),
        M=document.getElementById('endMsg'), A=document.getElementById('againBtn');
  if(win){
    es.classList.add('win'); T.textContent='🏆 버그 소탕 성공!';
    B.textContent='스테이지 '+level+' 클리어';
    M.innerHTML=`<b>${bossName[game.boss.tier]}</b>를 처치했어요! 다음 스테이지엔 더 진화한 버그가 나타납니다.`;
    A.textContent='다음 스테이지 ▶';
    level++; if(level-1>best){ best=level-1; localStorage.setItem('buggle_best',best); }
  } else {
    es.classList.add('lose'); T.textContent='💥 버그에게 당했다!';
    B.textContent='버비 부대 전멸';
    M.innerHTML='파란 <b>+ / ×</b> 게이트를 골라 버비 부대를 더 키워보세요!';
    A.textContent='다시 도전 ↻'; level=1;
  }
}

document.getElementById('startBtn').onclick=()=>startLevel();
document.getElementById('againBtn').onclick=()=>startLevel();

// 시작화면 히어로 버비 (drawBugby가 전역 ctx를 쓰므로 잠시 교체)
(function(){
  const hc=document.getElementById('heroCv'), hx=hc.getContext('2d');
  hx.clearRect(0,0,260,260);
  ctx=hx; drawBugby(130,130,54,true); ctx=mainCtx;
})();

requestAnimationFrame(loop);
</script>
