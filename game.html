<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Buggle World — Mob Cannon</title>
<style>
  :root{ --blue-l:#8ea6f2; --blue:#4a63d8; --navy:#1c2547; --pink:#f77fa0;
    --yellow:#f7c948; --glitch:#7a4bc0; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:#0d1330; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo",sans-serif; }
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas{ display:block; touch-action:none; }
  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:13px; text-align:center; padding:26px;
    background:radial-gradient(120% 90% at 50% 0%, rgba(74,99,216,.30), rgba(13,19,48,.93));
    backdrop-filter:blur(7px); color:#fff; z-index:10; }
  .brand{ font-size:40px; font-weight:900; letter-spacing:-1px; } .brand .dots{ color:var(--blue-l); }
  .sub{ font-size:14px; opacity:.85; line-height:1.6; max-width:340px; } .sub b{ color:var(--blue-l); } .sub .bad{ color:#c79bff; }
  .big{ font-size:44px; font-weight:900; } .win .big{ color:#7dffa8; } .lose .big{ color:#ff8f8f; }
  .btn{ margin-top:8px; padding:16px 46px; border:none; border-radius:18px; cursor:pointer; font-size:19px;
    font-weight:900; color:#fff; background:linear-gradient(135deg,var(--blue-l),var(--blue));
    box-shadow:0 10px 26px rgba(74,99,216,.5); transition:transform .08s; } .btn:active{ transform:scale(.95); }
  .hint{ font-size:12px; opacity:.55; margin-top:4px; } .hidden{ display:none !important; }
  .avatar{ width:110px; height:110px; }
</style>

<div id="wrap"><canvas id="cv"></canvas></div>

<div id="startScreen" class="overlay">
  <canvas id="heroCv" class="avatar" width="260" height="260"></canvas>
  <div class="brand">B<span class="dots">ü</span>ggle Cannon</div>
  <div class="sub">
    바닥의 <b>버비 캐논</b>이 유닛을 <b>계속 위로 발사</b>합니다.<br>
    <b>화면을 좌우로 드래그</b>해 캐논을 조준하세요.<br>
    파란 <b>×/＋</b> 게이트로 스트림을 <b>불리고</b>,<br>
    몰려오는 <span class="bad">버그</span>를 밀어내 <span class="bad">킹 글리치</span>를 부수세요!
  </div>
  <button class="btn" id="startBtn">발사! ▶</button>
  <div class="hint">Mob Control 스타일 · 버비 vs 글리치</div>
</div>

<div id="endScreen" class="overlay hidden">
  <div class="brand" id="endTitle" style="font-size:30px"></div>
  <div class="big" id="endBig"></div>
  <div class="sub" id="endMsg"></div>
  <button class="btn" id="againBtn"></button>
</div>

<script>
const cv=document.getElementById('cv');
let ctx=cv.getContext('2d'); const mainCtx=ctx;
const C={ blueL:'#8ea6f2', blue:'#4a63d8', navy:'#1c2547', pink:'#f77fa0', yellow:'#f7c948',
  face:'#f6f7fc', cheek:'#f6a6b4', glitch:'#7a4bc0', bug:'#1b1c22' };

let W,H,DPR;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2);
  const maxW=480, aw=Math.min(window.innerWidth,maxW), ah=window.innerHeight;
  let w=aw,h=w*16/9; if(h>ah){h=ah;w=h*9/16;}
  cv.style.width=w+'px'; cv.style.height=h+'px'; cv.width=w*DPR; cv.height=h*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0); W=w; H=h; }
window.addEventListener('resize',resize); resize();

const State={START:0,PLAY:1,END:2};
let state=State.START, level=1, best=+(localStorage.getItem('buggle_cannon_best')||0);

const g={ cannonX:.5, targetX:.5, units:[], gates:[], enemies:[], particles:[],
  fireTimer:0, spawnTimer:0, waveLeft:0, bossSpawned:false, boss:null, killed:0, shake:0, flash:0 };

// ===== 캐릭터 드로잉 =====
function roundRect(x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// 유닛(작은 버비) - 위에서 본 심플 버전
function drawUnit(x,y,r){
  ctx.fillStyle=C.blue; // 후드
  ctx.beginPath(); ctx.arc(x,y,r*1.15,0,7); ctx.fill();
  // 더듬이
  ctx.fillStyle=C.blueL||C.blue;
  ctx.beginPath(); ctx.arc(x-r*.7,y-r*.9,r*.28,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*.7,y-r*.9,r*.28,0,7); ctx.fill();
  ctx.fillStyle=C.face; ctx.beginPath(); ctx.arc(x,y,r*.82,0,7); ctx.fill();
  ctx.fillStyle='#101426';
  ctx.beginPath(); ctx.arc(x-r*.32,y,r*.16,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*.32,y,r*.16,0,7); ctx.fill();
}
// 히어로 버비(디테일)
function drawBugby(x,y,r){
  ctx.strokeStyle=C.blue; ctx.lineWidth=Math.max(1,r*.18); ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-r*.4,y-r*.7); ctx.lineTo(x-r*.7,y-r*1.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+r*.4,y-r*.7); ctx.lineTo(x+r*.7,y-r*1.5); ctx.stroke();
  ctx.fillStyle=C.blue;
  ctx.beginPath(); ctx.arc(x-r*.7,y-r*1.5,r*.26,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*.7,y-r*1.5,r*.26,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x,y-r*.05,r*1.12,0,7); ctx.fill();
  roundRect(x-r*.9,y+r*.5,r*1.8,r*1.5,r*.5); ctx.fill();
  ctx.fillStyle=C.face; ctx.beginPath(); ctx.arc(x,y-r*.05,r*.86,0,7); ctx.fill();
  ctx.fillStyle='#101426'; const ey=y-r*.05, ex=r*.34, es=r*.19;
  ctx.beginPath(); ctx.arc(x-ex,ey,es,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+ex,ey,es,0,7); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x-ex+es*.3,ey-es*.3,es*.35,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+ex+es*.3,ey-es*.3,es*.35,0,7); ctx.fill();
  ctx.fillStyle=C.cheek; ctx.globalAlpha=.8;
  ctx.beginPath(); ctx.arc(x-r*.55,ey+r*.28,r*.16,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*.55,ey+r*.28,r*.16,0,7); ctx.fill(); ctx.globalAlpha=1;
  ctx.strokeStyle='#101426'; ctx.lineWidth=r*.1;
  ctx.beginPath(); ctx.arc(x,ey+r*.3,r*.18,.15*Math.PI,.85*Math.PI); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.font=`900 ${r*.8}px -apple-system,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('B',x,y+r*1.25);
}
// 버그(위에서 본) type 0,1,2
function drawBug(x,y,r,type){
  const body=type===0?C.bug:(type===1?'#2a1a44':'#2c153f');
  if(type>0){ ctx.fillStyle=type===2?'rgba(150,60,220,.30)':'rgba(120,60,190,.22)';
    ctx.beginPath(); ctx.arc(x,y,r*1.5,0,7); ctx.fill(); }
  // 다리
  ctx.strokeStyle=body; ctx.lineWidth=Math.max(1,r*.16); ctx.lineCap='round';
  for(let i=0;i<6;i++){ const a=(i/6)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*r*.8,y+Math.sin(a)*r*.8);
    ctx.lineTo(x+Math.cos(a)*r*1.35,y+Math.sin(a)*r*1.35); ctx.stroke(); }
  ctx.fillStyle=body; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  if(type>0){ ctx.fillStyle=type===2?'#4a1f7a':'#3a1a5e'; const sp=type===2?10:8;
    for(let i=0;i<sp;i++){ const a=i/sp*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(x+Math.cos(a-.12)*r,y+Math.sin(a-.12)*r);
      ctx.lineTo(x+Math.cos(a)*r*1.45,y+Math.sin(a)*r*1.45);
      ctx.lineTo(x+Math.cos(a+.12)*r,y+Math.sin(a+.12)*r); ctx.fill(); }
    ctx.fillStyle=body; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
  // 눈
  const ew=r*.3, eh=r*.24, ex=r*.34;
  ctx.fillStyle=type>0?'#ff2a3a':'#f4f5fb';
  ctx.beginPath(); ctx.ellipse(x-ex,y-r*.05,ew,eh,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+ex,y-r*.05,ew,eh,0,0,7); ctx.fill();
  if(type===0){ ctx.fillStyle='#101018';
    ctx.beginPath(); ctx.arc(x-ex,y-r*.05,ew*.5,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+ex,y-r*.05,ew*.5,0,7); ctx.fill(); }
  if(type===2){ ctx.fillStyle=C.yellow; const cw=r*1.2, cx=x-cw/2, cy=y-r*1.55, ch=r*.55;
    ctx.beginPath(); ctx.moveTo(cx,cy+ch); ctx.lineTo(cx,cy); ctx.lineTo(cx+cw*.25,cy+ch*.5);
    ctx.lineTo(cx+cw*.5,cy-ch*.2); ctx.lineTo(cx+cw*.75,cy+ch*.5); ctx.lineTo(cx+cw,cy);
    ctx.lineTo(cx+cw,cy+ch); ctx.closePath(); ctx.fill(); }
}

// ===== 게이트 생성 =====
function makeGates(){
  g.gates=[];
  const GY=H*(0.42+Math.random()*0.06);
  const op=good=>{ const r=Math.random();
    if(good){ if(r<.5) return {op:'mul',val:2+Math.floor(Math.random()*2)}; return {op:'add',val:1+Math.floor(Math.random()*2)}; }
    return {op:'div',val:2}; };
  const bothGood=Math.random()<.25;
  const specs = bothGood ? [op(true),op(true)] : (Math.random()<.5?[op(true),op(false)]:[op(false),op(true)]);
  const half=W*0.5;
  for(let i=0;i<2;i++){ specs[i].x=i*half; specs[i].w=half; specs[i].y=GY; g.gates.push(specs[i]); }
}
const gateColor=o=>(o.op==='mul'||o.op==='add')?C.blue:C.glitch;
const gateLabel=o=>({mul:'×',add:'＋',div:'÷'}[o.op])+o.val;

// ===== 레벨 =====
function startLevel(){
  state=State.PLAY;
  g.cannonX=.5; g.targetX=.5; g.units=[]; g.enemies=[]; g.particles=[];
  g.fireTimer=0; g.spawnTimer=1.0; g.bossSpawned=false; g.boss=null; g.killed=0; g.shake=0; g.flash=0;
  g.waveLeft = 6+level*2;   // 보스 전까지 잡아야 할 적 수
  makeGates();
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.add('hidden');
}
function bossTier(){ return level<=1?0:level<=3?1:2; }
const bossName=['버그링 대장','글리치','킹 글리치'];

// ===== 입력 =====
let drag=false,dsx=0,ls=0;
const pDown=x=>{drag=true;dsx=x;ls=g.targetX;};
const pMove=x=>{ if(!drag)return; const dx=(x-dsx)/cv.clientWidth;
  g.targetX=Math.max(.08,Math.min(.92,ls+dx)); };
const pUp=()=>drag=false;
cv.addEventListener('mousedown',e=>pDown(e.clientX));
window.addEventListener('mousemove',e=>pMove(e.clientX));
window.addEventListener('mouseup',pUp);
cv.addEventListener('touchstart',e=>{e.preventDefault();pDown(e.touches[0].clientX);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();pMove(e.touches[0].clientX);},{passive:false});
cv.addEventListener('touchend',pUp);

// ===== 스폰 =====
function spawnEnemy(){
  const t = level<=1?0:(Math.random()<(level<=3?.6:.35)?0:1);
  const count = (t===0? 8+Math.floor(Math.random()*10) : 20+Math.floor(Math.random()*20)) + level*3;
  g.enemies.push({ x:.15+Math.random()*.7, y:-40, count, max:count, tier:t, boss:false,
    speed:(18+level*2)+(t===0?6:0) });
}
function spawnBoss(){
  const tier=bossTier(), count=Math.round((120+level*90)*(1+level*.1));
  g.boss={ x:.5, y:-70, count, max:count, tier, boss:true, speed:12 };
  g.enemies.push(g.boss); g.bossSpawned=true;
}

// ===== 루프 =====
let lastT=performance.now();
function loop(now){ const dt=Math.min((now-lastT)/1000,.05); lastT=now;
  if(state===State.PLAY) update(dt); render(); requestAnimationFrame(loop); }

function update(dt){
  g.cannonX+=(g.targetX-g.cannonX)*Math.min(1,dt*14);
  g.flash*=Math.pow(.001,dt); g.shake*=Math.pow(.0001,dt);
  const cx=g.cannonX*W, cannonY=H-70;

  // 발사
  g.fireTimer-=dt;
  if(g.fireTimer<=0){ g.fireTimer=0.06;
    if(g.units.length<260) g.units.push({x:cx+(Math.random()*2-1)*10, y:cannonY, py:cannonY, passed:0}); }

  // 적 스폰
  if(!g.bossSpawned){
    g.spawnTimer-=dt;
    if(g.spawnTimer<=0 && g.waveLeft>0){ g.spawnTimer=Math.max(.8,1.8-level*.12);
      spawnEnemy(); g.waveLeft--; }
    if(g.waveLeft<=0 && g.enemies.length===0){ spawnBoss(); }
  }

  const uspeed=H*0.55;
  // 유닛 이동 + 게이트
  for(let i=g.units.length-1;i>=0;i--){ const u=g.units[i];
    u.py=u.y; u.y-=uspeed*dt;
    if(u.y<-20){ g.units.splice(i,1); continue; }
    for(let gi=0;gi<g.gates.length;gi++){ const ga=g.gates[gi], bit=1<<gi;
      if((u.passed&bit)===0 && u.py>ga.y && u.y<=ga.y && u.x>=ga.x && u.x<=ga.x+ga.w){
        u.passed|=bit;
        if(ga.op==='mul'){ const add=ga.val-1;
          for(let k=0;k<add && g.units.length<260;k++)
            g.units.push({x:u.x+(Math.random()*2-1)*14,y:u.y,py:u.y,passed:u.passed}); }
        else if(ga.op==='add'){ for(let k=0;k<ga.val && g.units.length<260;k++)
            g.units.push({x:u.x+(Math.random()*2-1)*14,y:u.y,py:u.y,passed:u.passed}); }
        else if(ga.op==='div'){ if(Math.random()<1-1/ga.val){ g.units.splice(i,1); break; } }
      }
    }
  }

  // 적 이동 + 충돌
  for(let ei=g.enemies.length-1;ei>=0;ei--){ const e=g.enemies[ei];
    e.y+=e.speed*dt;
    const ex=e.x*W, er=e.boss?52:(16+Math.min(28,e.count*0.5));
    // 유닛 충돌
    for(let i=g.units.length-1;i>=0;i--){ const u=g.units[i];
      const dx=u.x-ex, dy=u.y-e.y;
      if(dx*dx+dy*dy < (er+8)*(er+8)){
        g.units.splice(i,1); e.count--;
        hit(u.x,u.y, e.tier>0?'#c79bff':'#ffd36b');
        if(e.count<=0){ boom(ex,e.y,e.tier); g.enemies.splice(ei,1); g.killed++;
          if(e.boss){ return endGame(true); } break; }
      }
    }
    // 캐논 도달 → 패배
    if(e.count>0 && e.y>=cannonY-20){ g.shake=1; return endGame(false); }
  }

  // 파티클
  for(const p of g.particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=260*dt; p.life-=dt*1.6; }
  g.particles=g.particles.filter(p=>p.life>0);
}

function hit(x,y,color){ for(let i=0;i<4;i++) g.particles.push({x,y,vx:(Math.random()*2-1)*70,
  vy:-Math.random()*100,r:2+Math.random()*2,life:.3+Math.random()*.2,color}); }
function boom(x,y,t){ g.flash=.15; for(let i=0;i<20;i++) g.particles.push({x,y,vx:(Math.random()*2-1)*200,
  vy:-Math.random()*220-40,r:3+Math.random()*4,life:.5+Math.random()*.4,color:t>0?'#c79bff':C.yellow}); }

// ===== 렌더 =====
function render(){
  let sx=0,sy=0; if(g.shake>.01){ sx=(Math.random()*2-1)*8*g.shake; sy=(Math.random()*2-1)*8*g.shake; }
  ctx.save(); ctx.translate(sx,sy);
  // 배경
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#2a3b78'); bg.addColorStop(1,'#4a63d8');
  ctx.fillStyle=bg; ctx.fillRect(-10,-10,W+20,H+20);
  // 도로
  const rw=W*0.82, rx=(W-rw)/2;
  ctx.fillStyle='#cdd6ec'; ctx.fillRect(rx,0,rw,H);
  ctx.strokeStyle='rgba(74,99,216,.25)'; ctx.lineWidth=3; ctx.setLineDash([18,16]);
  ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle='rgba(28,37,71,.35)'; ctx.lineWidth=4;
  ctx.beginPath(); ctx.moveTo(rx,0); ctx.lineTo(rx,H); ctx.moveTo(rx+rw,0); ctx.lineTo(rx+rw,H); ctx.stroke();

  // 게이트
  for(const ga of g.gates){ ctx.globalAlpha=.9; ctx.fillStyle=gateColor(ga);
    const gx=Math.max(rx,ga.x), gw=Math.min(ga.x+ga.w,rx+rw)-gx;
    roundRect(gx,ga.y-22,gw,44,8); ctx.fill();
    ctx.globalAlpha=1; ctx.fillStyle='rgba(255,255,255,.3)'; roundRect(gx,ga.y-22,gw,7,4); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='900 24px -apple-system,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(gateLabel(ga),gx+gw/2,ga.y); }

  // 적
  for(const e of g.enemies){ const ex=e.x*W, er=e.boss?52:(16+Math.min(28,e.count*0.5));
    ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(ex,e.y+er*.7,er*.9,er*.3,0,0,7); ctx.fill();
    drawBug(ex,e.y,er,e.tier);
    ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=4;
    ctx.font=`900 ${e.boss?30:18}px -apple-system,sans-serif`; ctx.textAlign='center'; ctx.textBaseline='middle';
    const t=Math.max(0,e.count).toString(); ctx.strokeText(t,ex,e.y); ctx.fillText(t,ex,e.y);
    if(e.boss){ const bw=er*2; ctx.fillStyle='rgba(0,0,0,.4)'; roundRect(ex-bw/2,e.y-er-16,bw,8,4); ctx.fill();
      ctx.fillStyle=C.pink; roundRect(ex-bw/2,e.y-er-16,bw*Math.max(0,e.count/e.max),8,4); ctx.fill();
      ctx.fillStyle='#fff'; ctx.globalAlpha=.9; ctx.font='800 16px -apple-system,sans-serif';
      ctx.fillText(bossName[e.tier],ex,e.y-er-28); ctx.globalAlpha=1; } }

  // 유닛
  for(const u of g.units) drawUnit(u.x,u.y,7);

  // 캐논 (버비 발사대)
  const cx=g.cannonX*W, cannonY=H-70;
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(cx,cannonY+34,44,12,0,0,7); ctx.fill();
  ctx.fillStyle=C.navy; roundRect(cx-34,cannonY+6,68,34,10); ctx.fill();
  ctx.fillStyle=C.blue; roundRect(cx-16,cannonY-30,32,44,10); ctx.fill(); // 포신
  ctx.fillStyle=C.blueL; ctx.beginPath(); ctx.arc(cx,cannonY-30,17,0,7); ctx.fill();
  drawUnit(cx,cannonY-30,10);

  // 파티클
  for(const p of g.particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); } ctx.globalAlpha=1;
  ctx.restore();

  // HUD
  ctx.fillStyle='rgba(15,20,45,.5)'; roundRect(10,10,140,36,10); ctx.fill();
  ctx.fillStyle=C.yellow; ctx.font='900 18px -apple-system,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('🔵 '+g.units.length,22,28);
  ctx.fillStyle='rgba(15,20,45,.5)'; roundRect(W-150,10,140,36,10); ctx.fill();
  ctx.fillStyle='#fff'; ctx.textAlign='right'; ctx.font='800 15px -apple-system,sans-serif';
  ctx.fillText('스테이지 '+level,W-22,28);
  if(g.bossSpawned){ ctx.fillStyle='rgba(120,40,180,.55)'; roundRect(W/2-66,12,132,28,9); ctx.fill();
    ctx.fillStyle='#fff'; ctx.textAlign='center'; ctx.font='800 14px -apple-system,sans-serif'; ctx.fillText('⚠ 보스!',W/2,26); }
  else { ctx.fillStyle='#fff'; ctx.globalAlpha=.8; ctx.textAlign='center'; ctx.font='700 13px -apple-system,sans-serif';
    ctx.fillText('남은 적 '+(g.waveLeft+g.enemies.length),W/2,26); ctx.globalAlpha=1; }
  if(Math.abs(g.flash)>.01){ ctx.fillStyle=`rgba(255,240,180,${g.flash})`; ctx.fillRect(0,0,W,H); }
}

function endGame(win){
  state=State.END;
  const es=document.getElementById('endScreen'); es.classList.remove('hidden','win','lose');
  const T=document.getElementById('endTitle'),B=document.getElementById('endBig'),
        M=document.getElementById('endMsg'),A=document.getElementById('againBtn');
  if(win){ es.classList.add('win'); T.textContent='🏆 버그 소탕 성공!';
    B.textContent='스테이지 '+level+' 클리어';
    M.innerHTML=`<b>${bossName[bossTier()]}</b>를 부쉈어요! 다음 스테이지엔 더 강한 버그가 몰려옵니다.`;
    A.textContent='다음 스테이지 ▶'; level++;
    if(level-1>best){ best=level-1; localStorage.setItem('buggle_cannon_best',best); }
  } else { es.classList.add('lose'); T.textContent='💥 방어선 붕괴!';
    B.textContent='버그가 캐논에 도달';
    M.innerHTML='파란 <b>×/＋</b> 게이트로 스트림을 더 키워 버그를 밀어내세요!';
    A.textContent='다시 도전 ↻'; level=1; }
}
document.getElementById('startBtn').onclick=()=>startLevel();
document.getElementById('againBtn').onclick=()=>startLevel();

(function(){ const hc=document.getElementById('heroCv'), hx=hc.getContext('2d');
  hx.clearRect(0,0,260,260); ctx=hx; drawBugby(130,130,52); ctx=mainCtx; })();

requestAnimationFrame(loop);
