<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Buggle World — Mob Cannon</title>
<style>
  :root{ --blue-l:#8ea6f2; --blue:#4a63d8; --navy:#1c2547; --pink:#f77fa0; --yellow:#f7c948; --glitch:#7a4bc0; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:#0d1330; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo",sans-serif; }
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas{ display:block; touch-action:none; }
  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; text-align:center; padding:26px;
    background:radial-gradient(120% 90% at 50% 0%, rgba(74,99,216,.30), rgba(13,19,48,.93));
    backdrop-filter:blur(7px); color:#fff; z-index:10; }
  .brand{ font-size:36px; font-weight:900; letter-spacing:-1px; } .brand .dots{ color:var(--blue-l); }
  .lanes{ display:flex; gap:8px; margin:2px 0; }
  .lane{ flex:1; border-radius:12px; padding:10px 6px; font-size:11.5px; line-height:1.45; font-weight:700; }
  .lane b{ display:block; font-size:15px; margin-bottom:2px; }
  .lane.l{ background:rgba(247,201,72,.16); color:#ffe08a; }
  .lane.c{ background:rgba(199,80,120,.16); color:#ff9db4; }
  .lane.r{ background:rgba(74,99,216,.20); color:#bcc9ff; }
  .sub{ font-size:13px; opacity:.8; max-width:340px; }
  .big{ font-size:42px; font-weight:900; } .win .big{ color:#7dffa8; } .lose .big{ color:#ff8f8f; }
  .btn{ margin-top:6px; padding:16px 46px; border:none; border-radius:18px; cursor:pointer; font-size:19px;
    font-weight:900; color:#fff; background:linear-gradient(135deg,var(--blue-l),var(--blue));
    box-shadow:0 10px 26px rgba(74,99,216,.5); transition:transform .08s; } .btn:active{ transform:scale(.95); }
  .hint{ font-size:12px; opacity:.55; } .hidden{ display:none !important; } .avatar{ width:88px; height:88px; }
</style>

<div id="wrap"><canvas id="cv"></canvas></div>

<div id="startScreen" class="overlay">
  <canvas id="heroCv" class="avatar" width="260" height="260"></canvas>
  <div class="brand">B<span class="dots">ü</span>ggle Cannon</div>
  <div class="sub"><b>1명</b>으로 시작! 캐논이 유닛을 계속 쏴요. <b>좌우로 드래그</b>해 조준하세요.</div>
  <div class="lanes">
    <div class="lane l">⬅ 왼쪽<b>배럴 깨기</b>깨면 등급↑<br>(병사→기사→왕)</div>
    <div class="lane c">⬆ 가운데<b>전투</b>적군이<br>엄청 몰려옴</div>
    <div class="lane r">➡ 오른쪽<b>＋1 갯수</b>내 캐릭터<br>수가 늘어남</div>
  </div>
  <div class="sub" style="opacity:.7">갯수(물량) × 등급(화력)을 키워 <b style="color:#c79bff">킹 글리치</b>를 부수세요!</div>
  <button class="btn" id="startBtn">발사! ▶</button>
  <div class="hint">TOP LORDS 스타일 · 버비 vs 글리치</div>
</div>

<div id="endScreen" class="overlay hidden">
  <div class="brand" id="endTitle" style="font-size:28px"></div>
  <div class="big" id="endBig"></div>
  <div class="sub" id="endMsg"></div>
  <button class="btn" id="againBtn"></button>
</div>

<script>
const cv=document.getElementById('cv');
let ctx=cv.getContext('2d'); const mainCtx=ctx;
const C={ blueL:'#8ea6f2', blue:'#4a63d8', navy:'#1c2547', pink:'#f77fa0', yellow:'#f7c948',
  face:'#f6f7fc', cheek:'#f6a6b4', glitch:'#7a4bc0', bug:'#1b1c22',
  wood:'#c98a3f', woodD:'#9c6a2c', steel:'#b7c0d0' };
const tierName=['','새내기 버비','견습 기사','기사 버비','대장 버비','킹 버비'];
const tierColor=['', C.blue, '#6d8ad6', '#9a86d6', '#d6a94a', '#f7c948'];

let W,H,DPR;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2);
  const maxW=480, aw=Math.min(window.innerWidth,maxW), ah=window.innerHeight;
  let w=aw,h=w*16/9; if(h>ah){h=ah;w=h*9/16;}
  cv.style.width=w+'px'; cv.style.height=h+'px'; cv.width=w*DPR; cv.height=h*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0); W=w; H=h; layout(); }
window.addEventListener('resize',resize);
let roadX,roadW,colW,rightGateY,barrelY;
function layout(){ roadW=W*0.94; roadX=(W-roadW)/2; colW=roadW/3; rightGateY=H*0.42; barrelY=H*0.20; }
resize();

const State={START:0,PLAY:1,END:2};
let state=State.START, level=1, best=+(localStorage.getItem('buggle_top_best')||0);

const g={ cannonX:.5, targetX:.5, units:[], enemies:[], particles:[], floats:[],
  count:1, tier:1, barrel:null, fireTimer:0, spawnTimer:0, waveLeft:0,
  bossSpawned:false, boss:null, shake:0, flash:0 };

// ===== 드로잉 =====
function roundRect(x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// 유닛(등급별). tier 1~5
function drawUnit(x,y,r,tier){
  const col=tierColor[Math.min(5,tier)]||C.blue;
  ctx.fillStyle=col; ctx.beginPath(); ctx.arc(x,y,r*1.15,0,7); ctx.fill();
  ctx.fillStyle=col;
  ctx.beginPath(); ctx.arc(x-r*.7,y-r*.9,r*.28,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*.7,y-r*.9,r*.28,0,7); ctx.fill();
  ctx.fillStyle=C.face; ctx.beginPath(); ctx.arc(x,y,r*.82,0,7); ctx.fill();
  ctx.fillStyle='#101426';
  ctx.beginPath(); ctx.arc(x-r*.32,y,r*.16,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*.32,y,r*.16,0,7); ctx.fill();
  if(tier>=2){ ctx.strokeStyle=C.steel; ctx.lineWidth=r*.28; // 투구 테
    ctx.beginPath(); ctx.arc(x,y,r*.95,Math.PI*1.05,Math.PI*1.95); ctx.stroke(); }
  if(tier>=3){ ctx.fillStyle=C.yellow; // 왕관
    ctx.beginPath(); ctx.moveTo(x-r*.5,y-r*1.05); ctx.lineTo(x-r*.5,y-r*1.5);
    ctx.lineTo(x-r*.17,y-r*1.2); ctx.lineTo(x,y-r*1.55); ctx.lineTo(x+r*.17,y-r*1.2);
    ctx.lineTo(x+r*.5,y-r*1.5); ctx.lineTo(x+r*.5,y-r*1.05); ctx.fill(); }
}
function drawBugby(x,y,r){
  ctx.strokeStyle=C.blue; ctx.lineWidth=r*.18; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x-r*.4,y-r*.7); ctx.lineTo(x-r*.7,y-r*1.5); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x+r*.4,y-r*.7); ctx.lineTo(x+r*.7,y-r*1.5); ctx.stroke();
  ctx.fillStyle=C.blue;
  ctx.beginPath(); ctx.arc(x-r*.7,y-r*1.5,r*.26,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*.7,y-r*1.5,r*.26,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x,y-r*.05,r*1.12,0,7); ctx.fill();
  roundRect(x-r*.9,y+r*.5,r*1.8,r*1.5,r*.5); ctx.fill();
  ctx.fillStyle=C.face; ctx.beginPath(); ctx.arc(x,y-r*.05,r*.86,0,7); ctx.fill();
  ctx.fillStyle='#101426'; const ey=y-r*.05, ex=r*.34, es=r*.19;
  ctx.beginPath(); ctx.arc(x-ex,ey,es,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+ex,ey,es,0,7); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(x-ex+es*.3,ey-es*.3,es*.35,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+ex+es*.3,ey-es*.3,es*.35,0,7); ctx.fill();
  ctx.fillStyle=C.cheek; ctx.globalAlpha=.8;
  ctx.beginPath(); ctx.arc(x-r*.55,ey+r*.28,r*.16,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+r*.55,ey+r*.28,r*.16,0,7); ctx.fill(); ctx.globalAlpha=1;
  ctx.fillStyle='#fff'; ctx.font=`900 ${r*.8}px -apple-system,sans-serif`;
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('B',x,y+r*1.25);
}
function drawBug(x,y,r,type){
  const body=type===0?C.bug:(type===1?'#2a1a44':'#2c153f');
  if(type>0){ ctx.fillStyle=type===2?'rgba(150,60,220,.30)':'rgba(120,60,190,.22)';
    ctx.beginPath(); ctx.arc(x,y,r*1.5,0,7); ctx.fill(); }
  ctx.strokeStyle=body; ctx.lineWidth=Math.max(1,r*.16); ctx.lineCap='round';
  for(let i=0;i<6;i++){ const a=(i/6)*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*r*.8,y+Math.sin(a)*r*.8);
    ctx.lineTo(x+Math.cos(a)*r*1.35,y+Math.sin(a)*r*1.35); ctx.stroke(); }
  ctx.fillStyle=body; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill();
  if(type>0){ ctx.fillStyle=type===2?'#4a1f7a':'#3a1a5e'; const sp=type===2?10:8;
    for(let i=0;i<sp;i++){ const a=i/sp*Math.PI*2;
      ctx.beginPath(); ctx.moveTo(x+Math.cos(a-.12)*r,y+Math.sin(a-.12)*r);
      ctx.lineTo(x+Math.cos(a)*r*1.45,y+Math.sin(a)*r*1.45);
      ctx.lineTo(x+Math.cos(a+.12)*r,y+Math.sin(a+.12)*r); ctx.fill(); }
    ctx.fillStyle=body; ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); }
  const ew=r*.3, eh=r*.24, ex=r*.34;
  ctx.fillStyle=type>0?'#ff2a3a':'#f4f5fb';
  ctx.beginPath(); ctx.ellipse(x-ex,y-r*.05,ew,eh,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+ex,y-r*.05,ew,eh,0,0,7); ctx.fill();
  if(type===0){ ctx.fillStyle='#101018';
    ctx.beginPath(); ctx.arc(x-ex,y-r*.05,ew*.5,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(x+ex,y-r*.05,ew*.5,0,7); ctx.fill(); }
  if(type===2){ ctx.fillStyle=C.yellow; const cw=r*1.2, cx=x-cw/2, cy=y-r*1.55, ch=r*.55;
    ctx.beginPath(); ctx.moveTo(cx,cy+ch); ctx.lineTo(cx,cy); ctx.lineTo(cx+cw*.25,cy+ch*.5);
    ctx.lineTo(cx+cw*.5,cy-ch*.2); ctx.lineTo(cx+cw*.75,cy+ch*.5); ctx.lineTo(cx+cw,cy);
    ctx.lineTo(cx+cw,cy+ch); ctx.closePath(); ctx.fill(); }
}
// 배럴(왼쪽 목표)
function drawBarrel(x,y,barrel){
  const w=colW*0.7, h=w*1.05;
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(x,y+h*.5,w*.5,w*.14,0,0,7); ctx.fill();
  ctx.fillStyle=C.wood; roundRect(x-w/2,y-h/2,w,h,w*.28); ctx.fill();
  ctx.fillStyle=C.woodD; // 테
  roundRect(x-w/2,y-h/2,w,h*.14,4); ctx.fill(); roundRect(x-w/2,y+h*.36,w,h*.14,4); ctx.fill();
  ctx.strokeStyle=C.steel; ctx.lineWidth=3; ctx.strokeRect(x-w/2,y-h*.44,w,3);
  // 안의 캐릭터(등급 미리보기)
  drawUnit(x,y-h*.06,w*0.20,barrel.toTier);
  // 숫자
  ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=5;
  ctx.font='900 30px -apple-system,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const t=Math.max(0,Math.ceil(barrel.hp)).toString();
  ctx.strokeText(t,x,y+h*.34); ctx.fillText(t,x,y+h*.34);
}

// ===== 레벨 =====
function makeBarrel(toTier){ const hp=Math.round(12*toTier*toTier*(1+level*.25)); return {toTier,hp,max:hp}; }
function startLevel(){
  state=State.PLAY;
  g.cannonX=.5; g.targetX=.5; g.units=[]; g.enemies=[]; g.particles=[]; g.floats=[];
  g.count=1; g.tier=1; g.barrel=makeBarrel(2);
  g.fireTimer=0; g.spawnTimer=1.2; g.bossSpawned=false; g.boss=null; g.shake=0; g.flash=0;
  g.waveLeft=10+level*3;
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.add('hidden');
}
function bossTier(){ return level<=1?0:level<=3?1:2; }
const bossName=['버그링 대장','글리치','킹 글리치'];

// ===== 입력 =====
let drag=false,dsx=0,ls=0;
const pDown=x=>{drag=true;dsx=x;ls=g.targetX;};
const pMove=x=>{ if(!drag)return; const dx=(x-dsx)/cv.clientWidth; g.targetX=Math.max(.06,Math.min(.94,ls+dx)); };
const pUp=()=>drag=false;
cv.addEventListener('mousedown',e=>pDown(e.clientX));
window.addEventListener('mousemove',e=>pMove(e.clientX));
window.addEventListener('mouseup',pUp);
cv.addEventListener('touchstart',e=>{e.preventDefault();pDown(e.touches[0].clientX);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();pMove(e.touches[0].clientX);},{passive:false});
cv.addEventListener('touchend',pUp);

const cenL=()=>(roadX+colW)/W, cenR=()=>(roadX+colW*2)/W;
function laneOf(px){ if(px<roadX+colW) return 0; if(px<roadX+colW*2) return 1; return 2; }

// ===== 스폰 =====
function spawnEnemy(midboss){
  const t=midboss?1:(level<=1?0:(Math.random()<.75?0:1));
  const count=(midboss?30+level*6:(t===0?3+Math.floor(Math.random()*5):8+Math.floor(Math.random()*8)))+level;
  const x=cenL()+Math.random()*(cenR()-cenL());
  g.enemies.push({x,y:-40,count,max:count,tier:t,boss:false,midboss:!!midboss,speed:(midboss?16:24+level*2)});
}
function spawnBoss(){ const tier=bossTier(), count=Math.round((160+level*110)*(1+level*.1));
  g.boss={x:(cenL()+cenR())/2,y:-70,count,max:count,tier,boss:true,speed:12};
  g.enemies.push(g.boss); g.bossSpawned=true; }

// ===== 루프 =====
let lastT=performance.now();
function loop(now){ const dt=Math.min((now-lastT)/1000,.05); lastT=now;
  if(state===State.PLAY) update(dt); render(); requestAnimationFrame(loop); }

function update(dt){
  g.cannonX+=(g.targetX-g.cannonX)*Math.min(1,dt*14);
  g.flash*=Math.pow(.001,dt); g.shake*=Math.pow(.0001,dt);
  const cx=g.cannonX*W, cannonY=H-70;

  // 발사 (count 많을수록 빠름/두꺼움)
  const rate=Math.min(55, 3+g.count*1.4), interval=1/rate;
  g.fireTimer-=dt; let emit=0;
  while(g.fireTimer<=0 && emit<4){ g.fireTimer+=interval; emit++;
    if(g.units.length<320) g.units.push({x:cx+(Math.random()*2-1)*10, y:cannonY, done:false}); }

  // 적 스폰(가운데, 물량 많이)
  if(!g.bossSpawned){ g.spawnTimer-=dt;
    if(g.spawnTimer<=0 && g.waveLeft>0){ const mid=(g.waveLeft%5===0);
      g.spawnTimer=mid?2.2:Math.max(.35,0.9-level*.05); spawnEnemy(mid); g.waveLeft--; }
    if(g.waveLeft<=0 && g.enemies.length===0) spawnBoss();
  }

  const uspeed=H*0.62;
  for(let i=g.units.length-1;i>=0;i--){ const u=g.units[i]; if(u.done){ g.units.splice(i,1); continue; }
    u.y-=uspeed*dt; const lane=laneOf(u.x);
    // 왼쪽: 배럴 깨기
    if(lane===0 && g.barrel && u.y<=barrelY+20){
      g.barrel.hp-=g.tier; hit(u.x,u.y,C.yellow); u.done=true;
      if(g.barrel.hp<=0){ g.tier=g.barrel.toTier; g.flash=.2;
        g.floats.push({x:u.x,y:barrelY,txt:'등급 UP! '+tierName[Math.min(5,g.tier)],life:1.3,color:C.yellow});
        boom(u.x,barrelY,1); g.barrel = g.tier<5 ? makeBarrel(g.tier+1) : null; }
      continue;
    }
    // 오른쪽: +1 갯수
    if(lane===2 && u.y<=rightGateY){
      g.count=Math.min(240,g.count+1); hit(u.x,u.y,C.blueL); u.done=true;
      if(Math.random()<.25) g.floats.push({x:u.x,y:rightGateY,txt:'＋1',life:.6,color:C.blueL});
      continue;
    }
    if(u.y<-20){ g.units.splice(i,1); }
  }

  // 적 이동 + 충돌(가운데)
  for(let ei=g.enemies.length-1;ei>=0;ei--){ const e=g.enemies[ei];
    e.y+=e.speed*dt; const ex=e.x*W, er=e.boss?54:(e.midboss?30:(13+Math.min(22,e.count*1.2)));
    for(let i=g.units.length-1;i>=0;i--){ const u=g.units[i]; if(u.done||laneOf(u.x)!==1) continue;
      const dx=u.x-ex, dy=u.y-e.y;
      if(dx*dx+dy*dy<(er+8)*(er+8)){ u.done=true; e.count-=g.tier;
        hit(u.x,u.y,e.tier>0?'#c79bff':'#ffd36b');
        if(e.count<=0){ boom(ex,e.y,e.tier); g.enemies.splice(ei,1);
          if(e.boss) return endGame(true); break; } }
    }
    if(e.count>0 && e.y>=cannonY-24){ g.shake=1; return endGame(false); }
  }
  g.units=g.units.filter(u=>!u.done);

  for(const p of g.particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=260*dt; p.life-=dt*1.6; }
  g.particles=g.particles.filter(p=>p.life>0);
  for(const f of g.floats){ f.y-=34*dt; f.life-=dt*1.1; }
  g.floats=g.floats.filter(f=>f.life>0);
}
function hit(x,y,color){ for(let i=0;i<4;i++) g.particles.push({x,y,vx:(Math.random()*2-1)*70,
  vy:-Math.random()*100,r:2+Math.random()*2,life:.3+Math.random()*.2,color}); }
function boom(x,y,t){ g.flash=Math.max(g.flash,.15); for(let i=0;i<18;i++) g.particles.push({x,y,
  vx:(Math.random()*2-1)*200,vy:-Math.random()*220-40,r:3+Math.random()*4,life:.5+Math.random()*.4,
  color:t>0?'#c79bff':C.yellow}); }

// ===== 렌더 =====
function render(){
  let sx=0,sy=0; if(g.shake>.01){ sx=(Math.random()*2-1)*8*g.shake; sy=(Math.random()*2-1)*8*g.shake; }
  ctx.save(); ctx.translate(sx,sy);
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#2a3b78'); bg.addColorStop(1,'#4a63d8');
  ctx.fillStyle=bg; ctx.fillRect(-10,-10,W+20,H+20);
  ctx.fillStyle='rgba(247,201,72,.12)'; ctx.fillRect(roadX,0,colW,H);
  ctx.fillStyle='#cdd6ec'; ctx.fillRect(roadX+colW,0,colW,H);
  ctx.fillStyle='rgba(74,99,216,.16)'; ctx.fillRect(roadX+colW*2,0,colW,H);
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=2;
  for(let i=0;i<=3;i++){ ctx.beginPath(); ctx.moveTo(roadX+colW*i,0); ctx.lineTo(roadX+colW*i,H); ctx.stroke(); }
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='800 12.5px -apple-system,sans-serif';
  ctx.fillStyle='#ffd873'; ctx.fillText('⬆ 배럴 깨기',roadX+colW*0.5,H-100);
  ctx.fillStyle='#8899c0'; ctx.fillText('⬆ 전투',roadX+colW*1.5,H-100);
  ctx.fillStyle='#aebbf5'; ctx.fillText('⬆ ＋갯수',roadX+colW*2.5,H-100);

  // 왼쪽 배럴
  if(g.barrel) drawBarrel(roadX+colW*0.5,barrelY,g.barrel);
  else { ctx.fillStyle=C.yellow; ctx.font='900 16px -apple-system,sans-serif';
    ctx.fillText('👑 MAX',roadX+colW*0.5,barrelY); }
  // 오른쪽 +1 게이트
  ctx.fillStyle=C.blue; roundRect(roadX+colW*2+6,rightGateY-18,colW-12,36,9); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.3)'; roundRect(roadX+colW*2+6,rightGateY-18,colW-12,7,4); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='900 22px -apple-system,sans-serif'; ctx.fillText('＋1',roadX+colW*2.5,rightGateY);

  // 적
  for(const e of g.enemies){ const ex=e.x*W, er=e.boss?54:(e.midboss?30:(13+Math.min(22,e.count*1.2)));
    ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(ex,e.y+er*.7,er*.9,er*.3,0,0,7); ctx.fill();
    drawBug(ex,e.y,er,e.tier);
    ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=4;
    ctx.font=`900 ${e.boss?28:(e.midboss?17:13)}px -apple-system,sans-serif`;
    const t=Math.max(0,e.count).toString(); ctx.strokeText(t,ex,e.y); ctx.fillText(t,ex,e.y);
    if(e.boss){ const bw=er*2; ctx.fillStyle='rgba(0,0,0,.4)'; roundRect(ex-bw/2,e.y-er-16,bw,8,4); ctx.fill();
      ctx.fillStyle=C.pink; roundRect(ex-bw/2,e.y-er-16,bw*Math.max(0,e.count/e.max),8,4); ctx.fill();
      ctx.fillStyle='#fff'; ctx.globalAlpha=.9; ctx.font='800 15px -apple-system,sans-serif';
      ctx.fillText(bossName[e.tier],ex,e.y-er-28); ctx.globalAlpha=1; } }

  for(const u of g.units) drawUnit(u.x,u.y,7,g.tier);

  const cx=g.cannonX*W, cannonY=H-70;
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(cx,cannonY+34,44,12,0,0,7); ctx.fill();
  ctx.fillStyle=C.navy; roundRect(cx-34,cannonY+6,68,34,10); ctx.fill();
  ctx.fillStyle=tierColor[Math.min(5,g.tier)]; roundRect(cx-16,cannonY-30,32,44,10); ctx.fill();
  drawUnit(cx,cannonY-30,11,g.tier);
  ctx.strokeStyle='rgba(255,255,255,.3)'; ctx.setLineDash([6,10]); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx,cannonY-42); ctx.lineTo(cx,90); ctx.stroke(); ctx.setLineDash([]);

  for(const p of g.particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); } ctx.globalAlpha=1;
  for(const f of g.floats){ ctx.globalAlpha=Math.max(0,Math.min(1,f.life)); ctx.fillStyle=f.color;
    ctx.font='900 18px -apple-system,sans-serif'; ctx.textAlign='center'; ctx.fillText(f.txt,f.x,f.y); }
  ctx.globalAlpha=1;
  ctx.restore();

  drawHUD();
  if(Math.abs(g.flash)>.01){ ctx.fillStyle=`rgba(255,240,180,${g.flash})`; ctx.fillRect(0,0,W,H); }
}
function drawHUD(){
  ctx.fillStyle='rgba(15,20,45,.55)'; roundRect(10,8,150,34,10); ctx.fill();
  ctx.fillStyle=C.yellow; ctx.font='900 15px -apple-system,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('⚔ '+tierName[Math.min(5,g.tier)],20,25);
  ctx.fillStyle='rgba(15,20,45,.55)'; roundRect(W-120,8,110,34,10); ctx.fill();
  ctx.fillStyle=C.blueL; ctx.textAlign='right'; ctx.font='900 17px -apple-system,sans-serif';
  ctx.fillText('🔵 '+g.count,W-20,25);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(g.bossSpawned){ ctx.fillStyle='rgba(120,40,180,.6)'; roundRect(W/2-58,10,116,26,9); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='800 14px -apple-system,sans-serif'; ctx.fillText('⚠ 보스!',W/2,23); }
  else { ctx.fillStyle='#fff'; ctx.globalAlpha=.8; ctx.font='700 12px -apple-system,sans-serif';
    ctx.fillText('스테이지 '+level+' · 남은적 '+(g.waveLeft+g.enemies.length),W/2,22); ctx.globalAlpha=1; }
}
function endGame(win){
  state=State.END;
  const es=document.getElementById('endScreen'); es.classList.remove('hidden','win','lose');
  const T=document.getElementById('endTitle'),B=document.getElementById('endBig'),
        M=document.getElementById('endMsg'),A=document.getElementById('againBtn');
  if(win){ es.classList.add('win'); T.textContent='🏆 버그 소탕 성공!';
    B.textContent='스테이지 '+level+' 클리어';
    M.innerHTML=`<b>${bossName[bossTier()]}</b>를 부쉈어요! 다음 스테이지엔 더 강한 버그가 몰려옵니다.`;
    A.textContent='다음 스테이지 ▶'; level++;
    if(level-1>best){ best=level-1; localStorage.setItem('buggle_top_best',best); }
  } else { es.classList.add('lose'); T.textContent='💥 방어선 붕괴!';
    B.textContent='버그가 캐논에 도달';
    M.innerHTML='<b style="color:#bcc9ff">오른쪽</b>에서 갯수를, <b style="color:#ffe08a">왼쪽</b> 배럴을 깨 등급을 올려 가운데를 막으세요!';
    A.textContent='다시 도전 ↻'; level=1; }
}
document.getElementById('startBtn').onclick=()=>startLevel();
document.getElementById('againBtn').onclick=()=>startLevel();

(function(){ const hc=document.getElementById('heroCv'), hx=hc.getContext('2d');
  hx.clearRect(0,0,260,260); ctx=hx; drawBugby(130,130,52); ctx=mainCtx; })();

requestAnimationFrame(loop);
</script>
