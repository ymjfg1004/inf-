<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Buggle World — Mob Cannon</title>
<style>
  :root{ --blue-l:#8ea6f2; --blue:#4a63d8; --navy:#1c2547; --pink:#f77fa0; --yellow:#f7c948; --glitch:#7a4bc0; }
  *{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; background:#0d1330; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo",sans-serif; }
  #wrap{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas{ display:block; touch-action:none; }
  .overlay{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; text-align:center; padding:26px;
    background:radial-gradient(120% 90% at 50% 0%, rgba(74,99,216,.30), rgba(13,19,48,.93));
    backdrop-filter:blur(7px); color:#fff; z-index:10; }
  .brand{ font-size:36px; font-weight:900; letter-spacing:-1px; } .brand .dots{ color:var(--blue-l); }
  .lanes{ display:flex; gap:8px; margin:2px 0; }
  .lane{ flex:1; border-radius:12px; padding:10px 6px; font-size:11.5px; line-height:1.45; font-weight:700; }
  .lane b{ display:block; font-size:15px; margin-bottom:2px; }
  .lane.l{ background:rgba(247,201,72,.16); color:#ffe08a; }
  .lane.c{ background:rgba(199,80,120,.16); color:#ff9db4; }
  .lane.r{ background:rgba(74,99,216,.20); color:#bcc9ff; }
  .sub{ font-size:13px; opacity:.8; max-width:340px; }
  .big{ font-size:42px; font-weight:900; } .win .big{ color:#7dffa8; } .lose .big{ color:#ff8f8f; }
  .btn{ margin-top:6px; padding:16px 46px; border:none; border-radius:18px; cursor:pointer; font-size:19px;
    font-weight:900; color:#fff; background:linear-gradient(135deg,var(--blue-l),var(--blue));
    box-shadow:0 10px 26px rgba(74,99,216,.5); transition:transform .08s; } .btn:active{ transform:scale(.95); }
  .hint{ font-size:12px; opacity:.55; } .hidden{ display:none !important; } .avatar{ width:88px; height:88px; }
</style>

<div id="wrap"><canvas id="cv"></canvas></div>

<div id="startScreen" class="overlay">
  <canvas id="heroCv" class="avatar" width="260" height="260"></canvas>
  <div class="brand">B<span class="dots">ü</span>ggle Cannon</div>
  <div class="sub"><b>1명</b>으로 시작! 캐논이 유닛을 계속 쏴요. <b>좌우로 드래그</b>해 조준하세요.</div>
  <div class="lanes">
    <div class="lane l">⬅ 왼쪽<b>배럴 깨기</b>깨면 등급↑<br>(병사→기사→왕)</div>
    <div class="lane c">⬆ 가운데<b>전투</b>적군이<br>엄청 몰려옴</div>
    <div class="lane r">➡ 오른쪽<b>＋1 갯수</b>내 캐릭터<br>수가 늘어남</div>
  </div>
  <div class="sub" style="opacity:.7">갯수(물량) × 등급(화력)을 키워 <b style="color:#c79bff">킹 글리치</b>를 부수세요!</div>
  <button class="btn" id="startBtn">발사! ▶</button>
  <div class="hint">TOP LORDS 스타일 · 버비 vs 글리치</div>
</div>

<div id="endScreen" class="overlay hidden">
  <div class="brand" id="endTitle" style="font-size:28px"></div>
  <div class="big" id="endBig"></div>
  <div class="sub" id="endMsg"></div>
  <button class="btn" id="againBtn"></button>
</div>

<script>
const cv=document.getElementById('cv');
let ctx=cv.getContext('2d'); const mainCtx=ctx;
const C={ blueL:'#8ea6f2', blue:'#4a63d8', navy:'#1c2547', pink:'#f77fa0', yellow:'#f7c948',
  face:'#f6f7fc', cheek:'#f6a6b4', glitch:'#7a4bc0', bug:'#1b1c22',
  wood:'#c98a3f', woodD:'#9c6a2c', steel:'#b7c0d0' };
const tierName=['','새내기 버비','견습 기사','기사 버비','대장 버비','킹 버비'];
const tierColor=['', C.blue, '#6d8ad6', '#9a86d6', '#d6a94a', '#f7c948'];

let W,H,DPR;
function resize(){ DPR=Math.min(window.devicePixelRatio||1,2);
  const maxW=480, aw=Math.min(window.innerWidth,maxW), ah=window.innerHeight;
  let w=aw,h=w*16/9; if(h>ah){h=ah;w=h*9/16;}
  cv.style.width=w+'px'; cv.style.height=h+'px'; cv.width=w*DPR; cv.height=h*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0); W=w; H=h; layout(); }
window.addEventListener('resize',resize);
let roadX,roadW,colW,rightGateY,barrelY;
function layout(){ roadW=W*0.94; roadX=(W-roadW)/2; colW=roadW/3; rightGateY=H*0.42; barrelY=H*0.20; }
resize();

const State={START:0,PLAY:1,END:2};
let state=State.START, level=1, best=+(localStorage.getItem('buggle_top_best')||0);

const g={ cannonX:.5, targetX:.5, units:[], enemies:[], particles:[], floats:[], cards:[], pOffs:[],
  count:1, tier:1, barrel:null, barrelTimer:0, fireTimer:0, spawnTimer:0, waveLeft:0, cardTimer:0, intro:0,
  bossSpawned:false, boss:null, shake:0, flash:0 };

// ===== 드로잉 =====
function roundRect(x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

// ===== 3D 느낌 스프라이트: 오프스크린에 한 번만 굽고 blit =====
// (나중에 실제 3D PNG를 받으면 SP.unit[t]/SP.bug[t]에 Image를 넣기만 하면 교체됨)
const SP={ unit:[], bug:[] };
function rr(x,X,Y,w,h,r){ r=Math.min(r,w/2,h/2); x.beginPath(); x.moveTo(X+r,Y);
  x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); }
function sphere(x,cx,cy,r,l,b,d){ const gg=x.createRadialGradient(cx-r*.38,cy-r*.42,r*.1,cx,cy,r*1.15);
  gg.addColorStop(0,l); gg.addColorStop(.55,b); gg.addColorStop(1,d);
  x.fillStyle=gg; x.beginPath(); x.arc(cx,cy,r,0,7); x.fill(); }
function eyeDot(x,ex,ey,r){ x.fillStyle='#0f1426'; x.beginPath(); x.arc(ex,ey,r,0,7); x.fill();
  x.fillStyle='#fff'; x.beginPath(); x.arc(ex+r*.32,ey-r*.36,r*.42,0,7); x.fill(); }
function crownSp(x,cx,cy,R){ const cw=R*1.15;
  const gg=x.createLinearGradient(cx-cw/2,cy-R*.5,cx+cw/2,cy+R*.2);
  gg.addColorStop(0,'#ffe9a3'); gg.addColorStop(1,'#e0a52a'); x.fillStyle=gg;
  x.beginPath(); x.moveTo(cx-cw/2,cy); x.lineTo(cx-cw/2,cy-R*.5); x.lineTo(cx-cw*.18,cy-R*.15);
  x.lineTo(cx,cy-R*.6); x.lineTo(cx+cw*.18,cy-R*.15); x.lineTo(cx+cw/2,cy-R*.5); x.lineTo(cx+cw/2,cy);
  x.closePath(); x.fill(); }
function mkCanvas(s){ const c=document.createElement('canvas'); c.width=s*2; c.height=s*2;
  const x=c.getContext('2d'); x.scale(2,2); return {c,x}; }

function drawUnitSprite(x,S,tier){
  const cx=S/2, cy=S*0.46, R=S*0.24;
  x.fillStyle='rgba(0,0,0,.16)'; x.beginPath(); x.ellipse(cx,S*0.9,R*1.0,R*0.28,0,0,7); x.fill();
  x.strokeStyle='#3b52c0'; x.lineWidth=S*0.05; x.lineCap='round';
  x.beginPath(); x.moveTo(cx-R*0.5,cy-R*0.7); x.lineTo(cx-R*0.85,cy-R*1.6); x.stroke();
  x.beginPath(); x.moveTo(cx+R*0.5,cy-R*0.7); x.lineTo(cx+R*0.85,cy-R*1.6); x.stroke();
  sphere(x,cx-R*0.85,cy-R*1.6,R*0.26,'#cdd8fb','#5f79df','#3a4fae');
  sphere(x,cx+R*0.85,cy-R*1.6,R*0.26,'#cdd8fb','#5f79df','#3a4fae');
  const bg=x.createLinearGradient(cx-R,cy+R*.5,cx+R,cy+R*2.3);
  bg.addColorStop(0,'#5f79df'); bg.addColorStop(1,'#2f4098'); x.fillStyle=bg;
  rr(x,cx-R*0.95,cy+R*0.55,R*1.9,R*1.7,R*0.55); x.fill();
  sphere(x,cx,cy,R*1.12,'#aebff9','#4a63d8','#2c3d94');
  sphere(x,cx,cy+R*0.03,R*0.82,'#ffffff','#eef0fb','#c9d2ef');
  eyeDot(x,cx-R*0.33,cy+R*0.03,R*0.17); eyeDot(x,cx+R*0.33,cy+R*0.03,R*0.17);
  x.fillStyle='rgba(246,150,170,.85)';
  x.beginPath(); x.arc(cx-R*0.55,cy+R*0.3,R*0.14,0,7); x.fill();
  x.beginPath(); x.arc(cx+R*0.55,cy+R*0.3,R*0.14,0,7); x.fill();
  if(tier>=2){ const hg=x.createLinearGradient(cx-R,cy-R,cx+R,cy);
    hg.addColorStop(0,'#eef2f8'); hg.addColorStop(1,'#8b98b2'); x.strokeStyle=hg;
    x.lineWidth=R*0.3; x.lineCap='round'; x.beginPath(); x.arc(cx,cy,R*0.99,Math.PI*1.04,Math.PI*1.96); x.stroke(); }
  if(tier>=3) crownSp(x,cx,cy-R*1.02,R);
  if(tier>=4){ x.fillStyle='#ff5a7a'; x.beginPath();
    x.moveTo(cx-R*0.9,cy+R*0.7); x.lineTo(cx-R*1.15,cy+R*1.7); x.lineTo(cx-R*0.35,cy+R*1.25); x.fill();
    x.beginPath(); x.moveTo(cx+R*0.9,cy+R*0.7); x.lineTo(cx+R*1.15,cy+R*1.7); x.lineTo(cx+R*0.35,cy+R*1.25); x.fill(); }
}
function drawBugSprite(x,S,type){
  const cx=S/2, cy=S*0.5, R=S*0.28;
  const p=type===0?['#3a3b45','#1b1c22','#0b0b10']:(type===1?['#5a3f8c','#2a1a44','#160a2b']:['#6a3fb0','#2c153f','#160726']);
  x.fillStyle='rgba(0,0,0,.18)'; x.beginPath(); x.ellipse(cx,S*0.92,R*1.0,R*0.26,0,0,7); x.fill();
  if(type>0){ x.fillStyle=type===2?'rgba(150,60,220,.28)':'rgba(120,60,190,.2)';
    x.beginPath(); x.arc(cx,cy,R*1.55,0,7); x.fill(); }
  x.strokeStyle=p[2]; x.lineWidth=S*0.045; x.lineCap='round';
  for(let i=0;i<6;i++){ const a=(i/6)*Math.PI*2;
    x.beginPath(); x.moveTo(cx+Math.cos(a)*R*.8,cy+Math.sin(a)*R*.8);
    x.lineTo(cx+Math.cos(a)*R*1.4,cy+Math.sin(a)*R*1.4); x.stroke(); }
  if(type>0){ x.fillStyle=type===2?'#4a1f7a':'#3a1a5e'; const sp=type===2?10:8;
    for(let i=0;i<sp;i++){ const a=i/sp*Math.PI*2;
      x.beginPath(); x.moveTo(cx+Math.cos(a-.12)*R,cy+Math.sin(a-.12)*R);
      x.lineTo(cx+Math.cos(a)*R*1.5,cy+Math.sin(a)*R*1.5);
      x.lineTo(cx+Math.cos(a+.12)*R,cy+Math.sin(a+.12)*R); x.fill(); } }
  sphere(x,cx,cy,R,p[0],p[1],p[2]);
  x.fillStyle='rgba(255,255,255,.16)'; x.beginPath(); x.ellipse(cx-R*.3,cy-R*.4,R*.28,R*.16,-0.5,0,7); x.fill();
  x.strokeStyle=p[2]; x.lineWidth=S*0.04;
  x.beginPath(); x.moveTo(cx-R*.3,cy-R*.85); x.lineTo(cx-R*.5,cy-R*1.4); x.stroke();
  x.beginPath(); x.moveTo(cx+R*.3,cy-R*.85); x.lineTo(cx+R*.5,cy-R*1.4); x.stroke();
  sphere(x,cx-R*.5,cy-R*1.4,R*.13,'#9aa','#333','#111');
  sphere(x,cx+R*.5,cy-R*1.4,R*.13,'#9aa','#333','#111');
  const ew=R*.3, eh=R*.24, ex=R*.34, ey=cy-R*.05;
  x.fillStyle=type>0?'#ff2a3a':'#f4f5fb';
  x.beginPath(); x.ellipse(cx-ex,ey,ew,eh,0,0,7); x.fill();
  x.beginPath(); x.ellipse(cx+ex,ey,ew,eh,0,0,7); x.fill();
  if(type===0){ x.fillStyle='#101018';
    x.beginPath(); x.arc(cx-ex,ey,ew*.5,0,7); x.fill(); x.beginPath(); x.arc(cx+ex,ey,ew*.5,0,7); x.fill();
    x.fillStyle='#fff'; x.beginPath(); x.arc(cx-ex+ew*.2,ey-eh*.35,ew*.22,0,7); x.fill();
    x.beginPath(); x.arc(cx+ex+ew*.2,ey-eh*.35,ew*.22,0,7); x.fill();
  } else { x.strokeStyle='#000'; x.lineWidth=R*.12;
    x.beginPath(); x.moveTo(cx-ex-ew,ey-eh*1.1); x.lineTo(cx-ex+ew*.6,ey-eh*.2); x.stroke();
    x.beginPath(); x.moveTo(cx+ex+ew,ey-eh*1.1); x.lineTo(cx+ex-ew*.6,ey-eh*.2); x.stroke(); }
  if(type===2) crownSp(x,cx,cy-R*1.5,R*1.1);
}
function buildSprites(){ const S=72;
  for(let t=1;t<=5;t++){ const {c,x}=mkCanvas(S); drawUnitSprite(x,S,t); SP.unit[t]=c; }
  for(let ty=0;ty<=2;ty++){ const {c,x}=mkCanvas(S); drawBugSprite(x,S,ty); SP.bug[ty]=c; } }

// ===== 실제 3D 이미지 슬롯 =====
// 여기에 투명 PNG의 data URI를 넣으면 굽은 스프라이트 대신 자동으로 사용됨.
//   ASSETS.unit[1] = 버비 기본, [2]=견습, [3]=기사, [4]=대장, [5]=킹 버비
//   ASSETS.bug[0]  = 버그링, [1]=글리치, [2]=킹 글리치
const ASSETS={ unit:{1:null,2:null,3:null,4:null,5:null}, bug:{0:null,1:null,2:null} };
function loadAssets(){
  const put=(store,key,src)=>{ if(!src) return; const im=new Image();
    im.onload=()=>{ store[key]=im; }; im.src=src; };
  for(const t in ASSETS.unit) put(SP.unit,+t,ASSETS.unit[t]);
  for(const ty in ASSETS.bug) put(SP.bug,+ty,ASSETS.bug[ty]);
}
function blit(spr,x,y,s){ if(!spr) return;
  const iw=spr.naturalWidth||spr.width, ih=spr.naturalHeight||spr.height||iw;
  const w=s, h=s*(ih/iw); ctx.drawImage(spr, x-w/2, y-h/2, w, h); }
// blit 래퍼 — 기존 시그니처 유지 (도형이든 이미지든 동일하게 처리)
function drawUnit(x,y,r,tier){ blit(SP.unit[Math.max(1,Math.min(5,tier|0))], x,y, r*4.0); }
function drawBug(x,y,r,type){ blit(SP.bug[Math.max(0,Math.min(2,type|0))], x,y, r*3.4); }
// 배럴(왼쪽 목표)
function drawBarrel(x,y,barrel){
  const w=colW*0.7, h=w*1.05;
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(x,y+h*.5,w*.5,w*.14,0,0,7); ctx.fill();
  ctx.fillStyle=C.wood; roundRect(x-w/2,y-h/2,w,h,w*.28); ctx.fill();
  ctx.fillStyle=C.woodD; // 테
  roundRect(x-w/2,y-h/2,w,h*.14,4); ctx.fill(); roundRect(x-w/2,y+h*.36,w,h*.14,4); ctx.fill();
  ctx.strokeStyle=C.steel; ctx.lineWidth=3; ctx.strokeRect(x-w/2,y-h*.44,w,3);
  // 안의 캐릭터(등급 미리보기)
  drawUnit(x,y-h*.06,w*0.20,barrel.toTier);
  // 숫자
  ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.lineWidth=5;
  ctx.font='900 30px -apple-system,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const t=Math.max(0,Math.ceil(barrel.hp)).toString();
  ctx.strokeText(t,x,y+h*.34); ctx.fillText(t,x,y+h*.34);
}

// ===== 레벨 =====
function makeBarrel(toTier){ const hp=Math.round((8*toTier*toTier+level*6)*(0.6+Math.random()*0.9));
  return {toTier,hp,max:hp,y:-42,speed:52+level*3,x:(roadX+colW*0.5)/W}; }
function startLevel(){
  state=State.PLAY;
  g.cannonX=.5; g.targetX=.5; g.units=[]; g.enemies=[]; g.particles=[]; g.floats=[];
  g.count=1; g.tier=1; g.barrel=null; g.barrelTimer=0.8; g.pOffs=makeWideOffs(60);
  g.fireTimer=0; g.spawnTimer=2.6; g.bossSpawned=false; g.boss=null; g.shake=0; g.flash=0;
  g.waveLeft=18+level*4; g.intro=3.6; g.cards=[]; g.cardTimer=0.6;
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.add('hidden');
}
function bossTier(){ return level<=1?0:level<=3?1:2; }
const bossName=['버그링 대장','글리치','킹 글리치'];

// ===== 입력 =====
let drag=false,dsx=0,ls=0;
const pDown=x=>{drag=true;dsx=x;ls=g.targetX;};
const pMove=x=>{ if(!drag)return; const dx=(x-dsx)/cv.clientWidth; g.targetX=Math.max(.06,Math.min(.94,ls+dx)); };
const pUp=()=>drag=false;
cv.addEventListener('mousedown',e=>pDown(e.clientX));
window.addEventListener('mousemove',e=>pMove(e.clientX));
window.addEventListener('mouseup',pUp);
cv.addEventListener('touchstart',e=>{e.preventDefault();pDown(e.touches[0].clientX);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();pMove(e.touches[0].clientX);},{passive:false});
cv.addEventListener('touchend',pUp);

const cenL=()=>(roadX+colW)/W, cenR=()=>(roadX+colW*2)/W;
function laneOf(px){ if(px<roadX+colW) return 0; if(px<roadX+colW*2) return 1; return 2; }

// ===== 스폰 =====
const MAXBUG=28; // 무리로 그릴 최대 벌레 수 (성능)
function makeOffs(n,sp){ const a=[]; for(let i=0;i<n;i++){ const ang=i*2.39996, rad=Math.sqrt(i)*sp;
  a.push({ox:Math.cos(ang)*rad, oy:Math.sin(ang)*rad*0.72}); } return a; }
// 내 부대: 한 칸(레인) 폭 안에서 겹쳐 채워지는 무리, 갯수 늘면 위로 쌓임
function makeWideOffs(n){ const a=[], halfW=colW*0.38;
  for(let i=0;i<n;i++){
    const ox=(Math.random()*2-1)*halfW;
    const oy=-Math.sqrt(i)*5.5 - Math.random()*14;
    a.push({ox, oy}); }
  return a; }
function enemyR(e){ if(e.boss) return 54;
  const shown=Math.min(MAXBUG,Math.max(1,Math.ceil(e.count))); return Math.sqrt(shown)*e.sp+e.cr; }
function spawnEnemy(midboss){
  const t=midboss?1:(level<=1?0:(Math.random()<.75?0:1));
  const count=(midboss?30+level*6:(t===0?3+Math.floor(Math.random()*5):8+Math.floor(Math.random()*8)))+level;
  const x=cenL()+Math.random()*(cenR()-cenL());
  const cr=midboss?10:8, sp=cr*1.2;
  g.enemies.push({x,y:-40,count,max:count,tier:t,boss:false,midboss:!!midboss,
    speed:(midboss?40:64+level*5),flash:0, cr, sp, offs:makeOffs(MAXBUG,sp)});
}
function spawnBoss(){ const tier=bossTier(), count=Math.round((160+level*110)*(1+level*.1));
  g.boss={x:(cenL()+cenR())/2,y:-70,count,max:count,tier,boss:true,speed:12};
  g.enemies.push(g.boss); g.bossSpawned=true; }

// ===== 루프 =====
let lastT=performance.now();
function loop(now){ const dt=Math.min((now-lastT)/1000,.05); lastT=now;
  if(state===State.PLAY) update(dt); render(); requestAnimationFrame(loop); }

function update(dt){
  g.cannonX+=(g.targetX-g.cannonX)*Math.min(1,dt*14);
  g.flash*=Math.pow(.001,dt); g.shake*=Math.pow(.0001,dt);
  const cx=g.cannonX*W, cannonY=H-70;

  // 발사 — 캐릭터 하나당 한 발씩, 각자 위치에서
  g.fireTimer-=dt;
  if(g.fireTimer<=0){ g.fireTimer=0.32;
    const pc=Math.min(g.pOffs.length,Math.max(1,Math.round(g.count))), pcy=cannonY-8;
    for(let k=0;k<pc && g.units.length<360;k++){ const o=g.pOffs[k];
      g.units.push({x:cx+o.ox, y:pcy+o.oy, done:false}); } }

  // 적 스폰(가운데, 물량 많이)
  if(g.intro>0) g.intro-=dt;
  if(!g.bossSpawned){ g.spawnTimer-=dt;
    if(g.spawnTimer<=0 && g.waveLeft>0){ const mid=(g.waveLeft%6===0);
      g.spawnTimer=mid?1.8:Math.max(.14,0.42-level*.05); spawnEnemy(mid); g.waveLeft--;
      if(!mid){ if(Math.random()<.8 && g.waveLeft>0){ spawnEnemy(false); g.waveLeft--; }
                if(Math.random()<.5 && g.waveLeft>0){ spawnEnemy(false); g.waveLeft--; } } }
    if(g.waveLeft<=0 && g.enemies.length===0) spawnBoss();
  }

  const uspeed=H*0.88;
  for(let i=g.units.length-1;i>=0;i--){ const u=g.units[i]; if(u.done){ g.units.splice(i,1); continue; }
    u.y-=uspeed*dt;
    if(u.y<-20){ g.units.splice(i,1); }
  }

  // 왼쪽: 내려오는 배럴(랜덤 숫자) — 가장 느림, 깨면 등급업, 놓치면 사라짐
  const bx=roadX+colW*0.5;
  if(!g.barrel){ if(g.tier<5){ g.barrelTimer-=dt; if(g.barrelTimer<=0) g.barrel=makeBarrel(g.tier+1); } }
  else { const b=g.barrel; b.y+=b.speed*dt;
    for(let i=g.units.length-1;i>=0;i--){ const u=g.units[i]; if(u.done||laneOf(u.x)!==0) continue;
      if(Math.abs(u.y-b.y)<38){ u.done=true; b.hp-=g.tier; hit(u.x,b.y,C.yellow);
        if(b.hp<=0){ g.tier=b.toTier; g.flash=.2; boom(bx,b.y,1);
          g.floats.push({x:bx,y:b.y,txt:'등급 UP! '+tierName[Math.min(5,g.tier)],life:1.3,color:C.yellow});
          g.barrel=null; g.barrelTimer=0.9; break; } } }
    if(g.barrel && g.barrel.y>cannonY-24){ g.floats.push({x:bx,y:cannonY-42,txt:'놓침!',life:.7,color:'#ffd873'});
      g.barrel=null; g.barrelTimer=0.7; }
  }

  // 오른쪽: 내려오는 +1 / (가끔)×n 카드 — 유닛으로 맞춰야 획득, 놓치면 사라짐
  g.cardTimer-=dt;
  if(g.cardTimer<=0){ g.cardTimer=0.95+Math.random()*0.7;
    const mul=Math.random()<0.07;
    const cxp=(roadX+colW*2.5)+(Math.random()*2-1)*colW*0.18;
    g.cards.push({x:cxp/W, y:-24, type:mul?'mul':'add', val:mul?(2+Math.floor(Math.random()*2)):1,
      speed:130+level*8}); }
  const cw=colW*0.72;
  for(let ci=g.cards.length-1;ci>=0;ci--){ const c=g.cards[ci]; c.y+=c.speed*dt;
    const cxpx=c.x*W; let got=false;
    for(let i=g.units.length-1;i>=0;i--){ const u=g.units[i]; if(u.done||laneOf(u.x)!==2) continue;
      if(Math.abs(u.x-cxpx)<cw/2 && Math.abs(u.y-c.y)<26){ u.done=true; got=true;
        if(c.type==='mul'){ g.count=Math.min(300,Math.max(2,Math.round(g.count*c.val)));
          g.floats.push({x:cxpx,y:c.y,txt:'×'+c.val+' 보너스!',life:1.1,color:C.yellow}); boom(cxpx,c.y,0); }
        else { g.count=Math.min(300,g.count+1); }
        hit(cxpx,c.y,c.type==='mul'?C.yellow:C.blueL); break; }
    }
    if(got){ g.cards.splice(ci,1); continue; }
    if(c.y>cannonY-24){ g.cards.splice(ci,1);
      if(c.type==='mul') g.floats.push({x:cxpx,y:cannonY-40,txt:'놓침!',life:.7,color:'#ff9db4'}); }
  }

  // 적 이동 + 충돌(가운데)
  for(let ei=g.enemies.length-1;ei>=0;ei--){ const e=g.enemies[ei];
    e.y+=e.speed*dt; if(e.flash>0) e.flash-=dt*3.5;
    const ex=e.x*W, er=enemyR(e);
    for(let i=g.units.length-1;i>=0;i--){ const u=g.units[i]; if(u.done||laneOf(u.x)!==1) continue;
      const dx=u.x-ex, dy=u.y-e.y;
      if(dx*dx+dy*dy<(er+8)*(er+8)){ u.done=true; e.count-=g.tier; e.flash=.3;
        hit(u.x,u.y,e.tier>0?'#c79bff':'#ffd36b');
        if(e.count<=0){ boom(ex,e.y,e.tier); g.enemies.splice(ei,1);
          if(e.boss) return endGame(true); break; } }
    }
    if(e.count>0 && e.y>=cannonY-24){ g.shake=1; return endGame(false); }
  }
  g.units=g.units.filter(u=>!u.done);

  for(const p of g.particles){ p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=260*dt; p.life-=dt*1.6; }
  g.particles=g.particles.filter(p=>p.life>0);
  for(const f of g.floats){ f.y-=34*dt; f.life-=dt*1.1; }
  g.floats=g.floats.filter(f=>f.life>0);
}
function hit(x,y,color){ for(let i=0;i<4;i++) g.particles.push({x,y,vx:(Math.random()*2-1)*70,
  vy:-Math.random()*100,r:2+Math.random()*2,life:.3+Math.random()*.2,color}); }
function boom(x,y,t){ g.flash=Math.max(g.flash,.15); for(let i=0;i<18;i++) g.particles.push({x,y,
  vx:(Math.random()*2-1)*200,vy:-Math.random()*220-40,r:3+Math.random()*4,life:.5+Math.random()*.4,
  color:t>0?'#c79bff':C.yellow}); }

// ===== 렌더 =====
function render(){
  let sx=0,sy=0; if(g.shake>.01){ sx=(Math.random()*2-1)*8*g.shake; sy=(Math.random()*2-1)*8*g.shake; }
  ctx.save(); ctx.translate(sx,sy);
  const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#2a3b78'); bg.addColorStop(1,'#4a63d8');
  ctx.fillStyle=bg; ctx.fillRect(-10,-10,W+20,H+20);
  ctx.fillStyle='rgba(247,201,72,.12)'; ctx.fillRect(roadX,0,colW,H);
  ctx.fillStyle='#cdd6ec'; ctx.fillRect(roadX+colW,0,colW,H);
  ctx.fillStyle='rgba(74,99,216,.16)'; ctx.fillRect(roadX+colW*2,0,colW,H);
  ctx.strokeStyle='rgba(255,255,255,.25)'; ctx.lineWidth=2;
  for(let i=0;i<=3;i++){ ctx.beginPath(); ctx.moveTo(roadX+colW*i,0); ctx.lineTo(roadX+colW*i,H); ctx.stroke(); }
  ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.font='800 12.5px -apple-system,sans-serif';
  ctx.fillStyle='#ffd873'; ctx.fillText('⬆ 배럴 깨기',roadX+colW*0.5,H-100);
  ctx.fillStyle='#8899c0'; ctx.fillText('⬆ 전투',roadX+colW*1.5,H-100);
  ctx.fillStyle='#aebbf5'; ctx.fillText('⬆ ＋갯수',roadX+colW*2.5,H-100);

  // 왼쪽 내려오는 배럴
  if(g.barrel) drawBarrel(g.barrel.x*W,g.barrel.y,g.barrel);
  else if(g.tier>=5){ ctx.fillStyle=C.yellow; ctx.font='900 16px -apple-system,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('👑 MAX 등급',roadX+colW*0.5,H*0.2); }
  // 오른쪽 내려오는 카드
  const cw=colW*0.72;
  for(const c of g.cards){ const cxpx=c.x*W, mul=c.type==='mul';
    ctx.fillStyle=mul?C.yellow:C.blue; roundRect(cxpx-cw/2,c.y-19,cw,38,10); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.32)'; roundRect(cxpx-cw/2,c.y-19,cw,8,5); ctx.fill();
    ctx.fillStyle=mul?'#3a2a00':'#fff'; ctx.font=`900 ${mul?22:20}px -apple-system,sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(mul?('×'+c.val):'＋1',cxpx,c.y); }

  // 적
  for(const e of g.enemies){ const ex=e.x*W, er=enemyR(e);
    if(e.boss){
      ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(ex,e.y+er*.7,er*.9,er*.3,0,0,7); ctx.fill();
      drawBug(ex,e.y,er,e.tier);
      if(e.flash>0){ ctx.globalAlpha=Math.min(1,e.flash); ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(ex,e.y,er,0,7); ctx.fill(); ctx.globalAlpha=1; }
      ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(0,0,0,.5)'; ctx.lineWidth=4;
      ctx.font='900 28px -apple-system,sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      const t=Math.max(0,e.count).toString(); ctx.strokeText(t,ex,e.y); ctx.fillText(t,ex,e.y);
      const bw=er*2; ctx.fillStyle='rgba(0,0,0,.4)'; roundRect(ex-bw/2,e.y-er-16,bw,8,4); ctx.fill();
      ctx.fillStyle=C.pink; roundRect(ex-bw/2,e.y-er-16,bw*Math.max(0,e.count/e.max),8,4); ctx.fill();
      ctx.fillStyle='#fff'; ctx.globalAlpha=.9; ctx.font='800 15px -apple-system,sans-serif';
      ctx.fillText(bossName[e.tier],ex,e.y-er-28); ctx.globalAlpha=1;
    } else {
      // 숫자 대신 갯수만큼 벌레 무리
      const shown=Math.min(e.offs.length,Math.max(1,Math.ceil(e.count)));
      ctx.fillStyle='rgba(0,0,0,.16)'; ctx.beginPath(); ctx.ellipse(ex,e.y+er*.55,er*.8,er*.26,0,0,7); ctx.fill();
      for(let k=0;k<shown;k++){ const o=e.offs[k]; drawBug(ex+o.ox,e.y+o.oy,e.cr,e.tier); }
      if(e.flash>0){ ctx.globalAlpha=Math.min(.7,e.flash); ctx.fillStyle='#fff';
        ctx.beginPath(); ctx.arc(ex,e.y,er*.85,0,7); ctx.fill(); ctx.globalAlpha=1; }
    } }

  // 총알(각 캐릭터가 쏜 작은 탄)
  { const col=tierColor[Math.min(5,g.tier)];
    for(const u of g.units){ if(u.done) continue;
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(u.x,u.y,4.5,0,7); ctx.fill();
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(u.x,u.y,3,0,7); ctx.fill(); } }

  const cx=g.cannonX*W, cannonY=H-70;
  // 내 부대(갯수) — 캐논 주위에 버비 무리, 카드 먹으면 커짐
  { const pc=Math.min(g.pOffs.length,Math.max(1,Math.round(g.count))), pcy=cannonY-8;
    ctx.fillStyle='rgba(0,0,0,.15)'; ctx.beginPath(); ctx.ellipse(cx,cannonY+16,colW*0.44,12,0,0,7); ctx.fill();
    for(let k=pc-1;k>=0;k--){ const o=g.pOffs[k]; drawUnit(cx+o.ox,pcy+o.oy,7,g.tier); } }
  ctx.fillStyle='rgba(0,0,0,.2)'; ctx.beginPath(); ctx.ellipse(cx,cannonY+30,52,12,0,0,7); ctx.fill();
  ctx.fillStyle=C.navy; roundRect(cx-34,cannonY+16,68,22,9); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.22)'; ctx.setLineDash([6,10]); ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(cx,cannonY); ctx.lineTo(cx,90); ctx.stroke(); ctx.setLineDash([]);

  for(const p of g.particles){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); } ctx.globalAlpha=1;
  for(const f of g.floats){ ctx.globalAlpha=Math.max(0,Math.min(1,f.life)); ctx.fillStyle=f.color;
    ctx.font='900 18px -apple-system,sans-serif'; ctx.textAlign='center'; ctx.fillText(f.txt,f.x,f.y); }
  ctx.globalAlpha=1;
  ctx.restore();

  // 시작 안내
  if(g.intro>0){ const a=Math.min(1,g.intro/1.2);
    ctx.globalAlpha=a; ctx.textAlign='center'; ctx.textBaseline='middle';
    const bob=Math.sin(performance.now()*.006)*6;
    const tips=[['왼쪽\n배럴 깨기',roadX+colW*0.5,'#ffd873'],
                ['가운데\n적 막기',roadX+colW*1.5,'#ff9db4'],
                ['오른쪽\n＋갯수',roadX+colW*2.5,'#aebbf5']];
    for(const[txt,x,col]of tips){ ctx.fillStyle=col; ctx.font='900 15px -apple-system,sans-serif';
      const ls=txt.split('\n'); ls.forEach((s,i)=>ctx.fillText(s,x,H*0.5+bob+i*20));
      ctx.font='900 26px -apple-system,sans-serif'; ctx.fillText('⬆',x,H*0.5+bob-30); }
    ctx.globalAlpha=1;
  }
  drawHUD();
  if(Math.abs(g.flash)>.01){ ctx.fillStyle=`rgba(255,240,180,${g.flash})`; ctx.fillRect(0,0,W,H); }
}
function drawHUD(){
  ctx.fillStyle='rgba(15,20,45,.55)'; roundRect(10,8,150,34,10); ctx.fill();
  ctx.fillStyle=C.yellow; ctx.font='900 15px -apple-system,sans-serif'; ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.fillText('⚔ '+tierName[Math.min(5,g.tier)],20,25);
  ctx.fillStyle='rgba(15,20,45,.55)'; roundRect(W-120,8,110,34,10); ctx.fill();
  ctx.fillStyle=C.blueL; ctx.textAlign='right'; ctx.font='900 17px -apple-system,sans-serif';
  ctx.fillText('🔵 '+g.count,W-20,25);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  if(g.bossSpawned){ ctx.fillStyle='rgba(120,40,180,.6)'; roundRect(W/2-58,10,116,26,9); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='800 14px -apple-system,sans-serif'; ctx.fillText('⚠ 보스!',W/2,23); }
  else { ctx.fillStyle='#fff'; ctx.globalAlpha=.8; ctx.font='700 12px -apple-system,sans-serif';
    ctx.fillText('스테이지 '+level+' · 남은적 '+(g.waveLeft+g.enemies.length),W/2,22); ctx.globalAlpha=1; }
}
function endGame(win){
  state=State.END;
  const es=document.getElementById('endScreen'); es.classList.remove('hidden','win','lose');
  const T=document.getElementById('endTitle'),B=document.getElementById('endBig'),
        M=document.getElementById('endMsg'),A=document.getElementById('againBtn');
  if(win){ es.classList.add('win'); T.textContent='🏆 버그 소탕 성공!';
    B.textContent='스테이지 '+level+' 클리어';
    M.innerHTML=`<b>${bossName[bossTier()]}</b>를 부쉈어요! 다음 스테이지엔 더 강한 버그가 몰려옵니다.`;
    A.textContent='다음 스테이지 ▶'; level++;
    if(level-1>best){ best=level-1; localStorage.setItem('buggle_top_best',best); }
  } else { es.classList.add('lose'); T.textContent='💥 방어선 붕괴!';
    B.textContent='버그가 캐논에 도달';
    M.innerHTML='<b style="color:#bcc9ff">오른쪽</b>에서 갯수를, <b style="color:#ffe08a">왼쪽</b> 배럴을 깨 등급을 올려 가운데를 막으세요!';
    A.textContent='다시 도전 ↻'; level=1; }
}
document.getElementById('startBtn').onclick=()=>startLevel();
document.getElementById('againBtn').onclick=()=>startLevel();

(function(){ buildSprites(); loadAssets();
  const hc=document.getElementById('heroCv'), hx=hc.getContext('2d');
  hx.clearRect(0,0,260,260);
  const big=mkCanvas(180); drawUnitSprite(big.x,180,1);
  hx.drawImage(big.c,15,20,230,230); })();

requestAnimationFrame(loop);
</script>
